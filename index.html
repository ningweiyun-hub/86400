<!doctype html>
<html lang="en">
<head>

  <title>86400 — AI Action Companion</title>
  <link rel="icon" href="assets/figma/icon-sparkles.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #edeae4;
      --background: #fdfbf7;
      --surface: #ffffff;
      --ink: #2c2b29;
      --muted: #6b6964;
      --faint: #9b9992;
      --line: #ebe6de;
      --line-strong: #c8c4bd;
      --coral: #d97d64;
      --coral-dark: #9f5848;
      --coral-soft: #fbf0ec;
      --sage: #64836b;
      --sage-soft: #eaf2ec;
      --amber: #b7823a;
      --amber-soft: #fdf8eb;
      --danger: #c75050;
      --danger-soft: #f9ecea;
      --night: #1a2538;
      --night-soft: #2a364f;
      --shadow: rgba(44, 43, 41, .14);
      --font: "Manrope", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    html { background: var(--canvas); }
    body { margin: 0; display: grid; place-items: center; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 24px; line-height: 1.3; letter-spacing: -.025em; font-weight: 800; }
    h2 { font-size: 20px; line-height: 1.35; letter-spacing: -.018em; font-weight: 800; }
    h3 { font-size: 15px; line-height: 1.4; font-weight: 700; }
    :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
    #app { position: relative; width: min(390px, 100vw); height: min(844px, 100dvh); overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: var(--background); box-shadow: 0 18px 55px var(--shadow); }
    .screen { height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--background); }
    .screen.night-screen { background: var(--night); color: var(--surface); }
    .status { height: 44px; flex: none; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; }
    .system-icons { display: flex; align-items: center; gap: 6px; }
    .system-icons img { display: block; object-fit: contain; }
    .night-screen .system-icons { filter: brightness(0) invert(1); }
    .screen-scroll { flex: 1; overflow: auto; padding: 12px 20px 28px; overscroll-behavior: contain; scrollbar-width: none; }
    .screen-scroll::-webkit-scrollbar { display: none; }
    .screen-scroll.flush { padding-top: 0; }
    .screen-scroll.centered { display: flex; flex-direction: column; justify-content: center; }
    .nav-header { min-height: 48px; display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; gap: 12px; margin-bottom: 18px; }
    .nav-title { overflow: hidden; text-align: center; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; font-weight: 700; }
    .icon-button { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; padding: 0; font-size: 28px; line-height: 1; }
    .icon-button.soft { background: var(--coral-soft); color: var(--coral); font-size: 17px; }
    .screen-header { margin-bottom: 16px; }
    .page-title { font-weight: 800; }
    .eyebrow { margin-bottom: 6px; color: var(--coral); font-size: 11px; line-height: 1.4; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .body-copy { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .small-copy { color: var(--faint); font-size: 12px; line-height: 1.45; }
    .night-screen .body-copy, .night-screen .small-copy { color: var(--line-strong); }
    .label { color: var(--faint); font-size: 11px; line-height: 1.45; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.top { align-items: flex-start; }
    .between { justify-content: space-between; }
    .grow { flex: 1; min-width: 0; }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .center { text-align: center; }
    .section-label { margin: 20px 0 9px; color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .divider { height: 1px; margin: 12px 0; background: var(--line); }
    .card { width: 100%; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 16px; }
    button.card { text-align: left; }
    .card.coral-border { border: 2px solid var(--coral); }
    .card.sage-card { background: var(--sage-soft); }
    .card.coral-card { background: var(--coral-soft); }
    .card.amber-card { background: var(--amber-soft); }
    .card.dark-card { border-color: var(--night-soft); background: var(--night-soft); color: var(--surface); }
    .compact-card { padding: 13px; }
    .pill { display: inline-flex; min-height: 24px; align-items: center; justify-content: center; padding: 4px 10px; border-radius: 100px; background: var(--coral-soft); color: var(--coral); font-size: 10.5px; font-weight: 700; white-space: nowrap; }
    .pill.sage { background: var(--sage-soft); color: var(--sage); }
    .pill.amber { background: var(--amber-soft); color: var(--amber); }
    .pill.ink { background: var(--ink); color: var(--surface); }
    .pill.outline { border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
    .button { width: 100%; min-height: 48px; border: 1px solid var(--coral); border-radius: 16px; background: var(--coral); color: var(--surface); padding: 12px 20px; font-size: 16px; line-height: 1.35; font-weight: 700; }
    .button.secondary { border-color: var(--line); background: var(--surface); color: var(--ink); }
    .button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    .button.sage { border-color: var(--sage); background: var(--sage); }
    .button.small { width: auto; min-height: 38px; border-radius: 12px; padding: 8px 14px; font-size: 12px; }
    .button:disabled, .chip:disabled, .field:disabled { cursor: wait; opacity: .55; }
    .text-button { border: 0; background: transparent; color: var(--coral); padding: 8px; font-size: 13px; font-weight: 700; }
    .footer { flex: none; display: flex; flex-direction: column; gap: 10px; background: var(--background); padding: 12px 24px calc(env(safe-area-inset-bottom, 0px) + 18px); }
    .night-screen .footer { background: var(--night); }
    .home-indicator { height: 5px; flex: none; width: 139px; margin: 0 auto 8px; border-radius: 100px; background: var(--ink); }
    .night-screen .home-indicator { background: var(--surface); }
    .tabs { height: 78px; flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding: 8px 0 calc(env(safe-area-inset-bottom, 0px) + 7px); }
    .tab { border: 0; background: transparent; color: var(--faint); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; font-weight: 600; }
    .tab.active { color: var(--coral); }
    .tab img { width: 20px; height: 20px; object-fit: contain; opacity: .65; }
    .tab.active img { opacity: 1; }
    .notice { padding: 12px; border-radius: 12px; background: var(--coral-soft); color: var(--muted); font-size: 12px; line-height: 1.5; }
    .notice.sage { background: var(--sage-soft); color: var(--sage); }
    .notice.amber { background: var(--amber-soft); color: var(--amber); }
    .notice.danger { border: 1px solid var(--danger); background: var(--danger-soft); color: var(--danger); }
    .progress { width: 100%; height: 6px; overflow: hidden; border-radius: 100px; background: var(--line); }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--sage); }
    .minimum { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px; color: var(--ink); font-size: 13px; line-height: 1.5; }
    .minimum .label { display: block; margin-bottom: 4px; }
    .plain-row, .task-row, .method-row { width: 100%; min-height: 56px; display: flex; align-items: center; gap: 11px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px 14px; text-align: left; }
    .plain-row { justify-content: space-between; }
    .task-row.current { border: 2px solid var(--coral); }
    .task-status { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 7px; font-size: 12px; font-weight: 700; }
    .task-status.done { border-color: var(--sage); background: var(--sage-soft); color: var(--sage); }
    .category-mark { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--coral-soft); color: var(--coral); font-size: 13px; font-weight: 700; }
    .category-mark.sage { background: var(--sage-soft); color: var(--sage); }
    .chevron { margin-left: auto; color: var(--faint); font-size: 19px; }
    .form-group { margin-bottom: 14px; }
    .form-group > label, .field-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .field { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 12px; outline: 0; background: var(--surface); padding: 12px 14px; font-size: 14px; }
    .field:focus { border-color: var(--coral); box-shadow: 0 0 0 2px var(--coral-soft); }
    textarea.field { min-height: 116px; resize: vertical; line-height: 1.55; }
    textarea.goal-field { min-height: 180px; }
    .field.error { border-color: var(--danger); }
    .error-copy { margin-top: 5px; color: var(--danger); font-size: 11px; line-height: 1.4; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1px solid var(--line); border-radius: 100px; background: var(--surface); padding: 7px 12px; color: var(--muted); font-size: 13px; }
    .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice { min-height: 48px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 9px; color: var(--muted); font-size: 13px; font-weight: 600; }
    .choice.selected { border: 2px solid var(--coral); background: var(--coral-soft); color: var(--ink); }
    .mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
    .mood-choice { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 9px 2px; text-align: center; color: var(--muted); font-size: 10px; }
    .mood-choice span { display: block; margin-bottom: 4px; font-size: 24px; }
    .mood-choice.selected { border: 2px solid var(--coral); background: var(--coral-soft); color: var(--ink); }
    .toggle { width: 44px; height: 24px; position: relative; flex: none; border: 0; border-radius: 100px; background: var(--line-strong); }
    .toggle::after { content: ""; position: absolute; width: 20px; height: 20px; top: 2px; left: 2px; border-radius: 50%; background: var(--surface); transition: transform .2s ease; }
    .toggle.on { background: var(--coral); }
    .toggle.on::after { transform: translateX(20px); }
    .file-drop { position: relative; min-height: 150px; display: grid; place-items: center; border: 1.5px dashed var(--coral); border-radius: 14px; background: var(--surface); padding: 18px; text-align: center; overflow: hidden; }
    .file-drop input { position: absolute; inset: 0; z-index: 2; width: 100%; opacity: 0; cursor: pointer; }
    .photo-preview { width: 100%; height: 220px; border-radius: 14px; object-fit: cover; background: var(--coral-soft); }
    .timer { width: 220px; height: 220px; display: grid; place-items: center; margin: 26px auto 18px; border: 2px solid var(--coral); border-radius: 50%; text-align: center; }
    .timer strong { display: block; font-size: 48px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
    .timer span { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .stat { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 4px; text-align: center; }
    .stat strong { display: block; font-size: 19px; }
    .stat span { color: var(--muted); font-size: 10px; }
    .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .shop-item { padding: 10px; }
    .shop-item img { width: 100%; height: 110px; border-radius: 10px; object-fit: cover; }
    .two-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hero-art { display: block; width: 220px; height: 220px; margin: 4px auto; object-fit: contain; mix-blend-mode: multiply; }
    .hero-art.small { width: 150px; height: 150px; }
    .continuity-hero { display: block; width: 220px; height: 220px; margin: 4px auto; object-fit: contain; border-radius: 50%; background: var(--coral-soft); mix-blend-mode: multiply; }
    .night-complete .continuity-hero { background: var(--warm); mix-blend-mode: normal; box-shadow: 0 18px 50px rgba(0,0,0,.18); }
    .pet-scene { position: relative; width: 100%; max-width: 330px; height: 250px; margin: 4px auto 10px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: var(--coral-soft); }
    .pet-scene.compact { max-width: 300px; height: 220px; }
    .pet-scene-room { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; opacity: .88; mix-blend-mode: multiply; }
    .pet-scene-pet { position: relative; z-index: 2; width: 215px; height: 215px; margin-top: 12px; object-fit: contain; border-radius: 50%; mix-blend-mode: multiply; }
    .pet-scene.compact .pet-scene-pet { width: 190px; height: 190px; }
    .pet-scene-hat { position: absolute; z-index: 3; top: 25px; left: 50%; width: 105px; height: 78px; object-fit: contain; transform: translateX(-50%) rotate(-2deg); filter: drop-shadow(0 4px 5px rgba(44,43,41,.12)); pointer-events: none; }
    .pet-scene.compact .pet-scene-hat { top: 21px; width: 92px; height: 68px; }
    .egg-crack-stage { position: relative; width: 230px; height: 250px; margin: 0 auto; display: grid; place-items: center; }
    .egg-crack-stage .egg-art { width: 220px; height: 235px; margin: 0; }
    .egg-crack { position: absolute; z-index: 2; left: 47px; top: 78px; width: 136px; height: 70px; overflow: hidden; filter: drop-shadow(0 1px 0 rgba(255,255,255,.8)); }
    .wide-art { display: block; width: 100%; height: 198px; border-radius: 16px; object-fit: cover; background: var(--coral-soft); }
    .egg-art { display: block; width: 220px; height: 260px; margin: 0 auto; object-fit: contain; mix-blend-mode: multiply; }
    .pet-orbit { width: 230px; height: 230px; display: grid; place-items: center; margin: 2px auto 10px; border-radius: 50%; background: var(--coral-soft); }
    .pet-orbit img { width: 210px; height: 210px; object-fit: contain; border-radius: 50%; mix-blend-mode: multiply; }
    .avatar { width: 44px; height: 44px; flex: none; border-radius: 50%; object-fit: cover; background: var(--coral-soft); }
    .welcome { min-height: 610px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .welcome-logo { font-size: 48px; line-height: 1; font-weight: 800; letter-spacing: .04em; }
    .welcome-art { width: 220px; height: 260px; margin-top: 34px; object-fit: contain; }
    .step-dots { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; }

    .step-dots i.active { width: 24px; background: var(--coral); }
    .quote { border: 1px solid var(--coral); border-radius: 14px; background: var(--coral-soft); padding: 14px; color: var(--muted); font-size: 13px; line-height: 1.5; text-align: center; }
    .success-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 12px; background: var(--sage-soft); padding: 12px; color: var(--sage); font-size: 13px; font-weight: 700; }

    .safe-copy { color: var(--sage); }
    .danger-copy { color: var(--danger); }
    .token { color: var(--amber); font-weight: 700; }
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before { content: ""; position: absolute; top: 6px; bottom: 6px; left: 7px; width: 2px; background: var(--line); }
    .timeline-item { position: relative; margin-bottom: 16px; }
    .timeline-item::before { content: ""; position: absolute; top: 5px; left: -21px; width: 10px; height: 10px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 4px var(--coral-soft); }
    .night-complete { min-height: 620px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .night-complete img { width: 230px; height: 230px; object-fit: contain; mix-blend-mode: screen; }
    @media (max-width: 390px) { #app { border: 0; border-radius: 0; box-shadow: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
  </style>
</head>

        case "side-log": mutate(() => { state.sideDraft = clone(DEFAULT_STATE.sideDraft); state.view = "side-log"; }); break;
        case "side-mood": mutate(() => { state.sideDraft.mood = value; }); break;
        case "save-side-activity": mutate(() => { if (state.sideDraft.title.trim().length < 3) state.sideDraft.error = "Describe the activity before recording it."; else { state.sideDraft.error = ""; state.sideSaved = clone(state.sideDraft); state.tokens += 5; state.logs.push({ type: "side", activity: clone(state.sideDraft), at: new Date().toISOString() }); state.view = "side-saved"; } }); break;
        case "end-day": mutate(() => { state.eod.step = 0; state.eod.skipped = false; state.nextAction = null; state.nextActionStatus = "idle"; state.nextActionError = ""; state.view = "end-day"; }); break;
        case "eod-next": mutate(() => { state.eod.step = Math.min(6, state.eod.step + 1); }); break;
        case "eod-back": mutate(() => { state.eod.step = Math.max(0, state.eod.step - 1); }); break;
        case "eod-mood": mutate(() => { state.eod.mood = value; }); break;
        case "eod-skip-reflection": mutate(() => { state.eod.skipped = true; state.eod.step = 4; }); break;
        case "eod-skip-all": mutate(() => { state.eod.skipped = true; state.eod.step = 4; }); break;
        case "eod-generate-next": requestNextAction(); break;
        case "eod-finish": {
          if (!state.nextAction) { requestNextAction(); break; }
          mutate(() => {
            const next = state.nextAction;
            state.logs.push({ type: "end-of-day", mood: state.eod.mood, reflection: state.eod.reflection, skipped: state.eod.skipped, nextAction: next.title, at: new Date().toISOString() });
            const nextTask = { id: `day-${next.day}`, day: next.day, title: next.title, description: next.description, duration: next.durationMinutes, min: next.minimumCompletion, required: "Photo, link, written note, or honest self-confirmation", done: false, optional: false, difficulty: next.difficulty };
            state.tasks = [nextTask]; state.current = nextTask.id; state.timer = nextTask.duration * 60;
            state.eod = clone(DEFAULT_STATE.eod); state.nextAction = null; state.nextActionStatus = "idle"; state.nextActionError = "";
            resetCompletionDraft(); state.view = ""; state.tab = "today"; state.pet.status = "neutral";
          });
          break;
        }
        case "weekly-review": mutate(() => { state.weeklyFlow.step = 0; state.view = "weekly-review"; }); break;
        case "weekly-next": mutate(() => { state.weeklyFlow.step = Math.min(6, state.weeklyFlow.step + 1); }); break;
        case "weekly-back": mutate(() => { state.weeklyFlow.step = Math.max(0, state.weeklyFlow.step - 1); }); break;
        case "weekly-mood": mutate(() => { state.weeklyFlow.mood = value; }); break;
        case "weekly-finish": mutate(() => { state.logs.push({ type: "weekly-review", mood: state.weeklyFlow.mood, reflection: state.weeklyFlow.reflection, at: new Date().toISOString() }); state.weeklyFlow.step = 0; state.view = ""; state.tab = "today"; }); break;
        case "journey-complete": go("journey-complete"); break; case "journey-summary": go("journey-summary"); break; case "journey-archive": go("journey-archive"); break;
        case "archive-journey": mutate(() => { state.view = "journey-archive"; }, "Journey archived"); break;
        case "shop-category": mutate(() => { state.shopSection = value; state.view = "shop-category"; }); break;
        case "shop-item": mutate(() => { state.selectedProduct = id; state.view = "item-detail"; }); break;
        case "shop-item-back": go("item-detail"); break; case "purchase-confirm": go("purchase-confirm"); break;
        case "purchase": { const item = PRODUCTS[state.selectedProduct]; if (state.tokens < item.cost) { showToast("Not enough tokens"); break; } mutate(() => { state.tokens -= item.cost; if (!state.owned.includes(item.id)) state.owned.push(item.id); state.view = "purchase-success"; }); break; }
        case "equip-now": mutate(() => { if (!state.equipped.includes(state.selectedProduct)) state.equipped.push(state.selectedProduct); state.view = "equipped"; }); break;
        case "collection": go("collection"); break; case "equipped": go("equipped"); break;
        case "unequip": mutate(() => { state.equipped = state.equipped.filter(item => item !== id); }); break;
        case "settings": mutate(() => { state.settingsReturn = state.view || state.tab; state.view = "settings"; }); break;
        case "settings-back": if (["today", "tasks", "journey", "shop"].includes(state.settingsReturn)) go("", state.settingsReturn); else go("", "today"); break;
        case "rename-pet": mutate(() => { ensurePet(); state.pet.nameDraft = state.pet.name || ""; state.hatchStep = 3; state.view = "hatch"; }); break;
        case "replay-onboarding": mutate(() => { state = clone(DEFAULT_STATE); }); break;
        case "reset-prototype": if (window.confirm("Reset all local prototype progress?")) { state = clone(DEFAULT_STATE); saveState(); render(); } break;
      }
    });
    document.addEventListener("input", event => {
      const input = event.target; const binding = input.dataset.bind; if (!binding) return; const value = input.type === "checkbox" ? input.checked : input.value;
      if (binding === "brief") { state.brief = value; state.goalError = ""; state.planError = ""; state.aiPlan = null; const count = document.getElementById("goal-count"); const error = document.getElementById("goal-error"); if (count) count.textContent = `${value.length} / 800`; if (error) error.textContent = ""; }
      if (binding === "pet-name") { state.pet.nameDraft = value; state.pet.nameError = ""; const count = document.getElementById("pet-name-count"); if (count) count.textContent = `${value.length}/20`; }
      if (binding === "evidence-link") { state.evidence.link = value; state.evidence.error = ""; }
      if (binding === "evidence-note") { state.evidence.note = value; state.evidence.error = ""; const count = document.getElementById("evidence-note-count"); const add = document.querySelector('[data-action="evidence-add"]'); const length = value.trim().length; if (count) count.textContent = `${length} characters`; if (add) { add.disabled = length < 10; add.setAttribute("aria-disabled", length < 10 ? "true" : "false"); } }
      if (binding === "evidence-self") { state.evidence.self = value; state.evidence.error = ""; }
      if (binding === "reflection-learning") { state.reflection.learning = value; state.reflection.error = ""; }
      if (binding === "reflection-next") state.reflection.next = value;
      if (binding === "side-title") { state.sideDraft.title = value; state.sideDraft.error = ""; }
      if (binding === "side-category") state.sideDraft.category = value;
      if (binding === "side-duration") state.sideDraft.duration = Math.max(5, Number(value) || 5);
      if (binding === "side-outcome") state.sideDraft.outcome = value;
      if (binding === "side-note") state.sideDraft.note = value;
      if (binding === "side-evidence") state.sideDraft.evidence = value;
      if (binding === "eod-reflection") state.eod.reflection = value;
      if (binding === "weekly-reflection") state.weeklyFlow.reflection = value;
      saveState();
    });
    document.addEventListener("change", event => {
      if (event.target.id !== "evidence-file") return; const file = event.target.files?.[0]; if (photoPreviewUrl) URL.revokeObjectURL(photoPreviewUrl); photoPreviewUrl = file ? URL.createObjectURL(file) : ""; state.evidence.photo = file ? file.name : ""; state.evidence.error = ""; saveState(); render();
    });
    window.setInterval(() => { if (state.view === "focus" && state.running && state.timer > 0) { state.timer -= 1; saveState(); render(); } }, 1000);
    render();
    if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js?v=65", { updateViaCache: "none" }).catch(error => console.warn("Offline support could not be registered.", error));
  </script>
