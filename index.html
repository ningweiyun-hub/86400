<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0d1512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="86,400">
<meta name="format-detection" content="telephone=no">
<title>86,400</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* ── After Hours tokens ──────────────────────────────────────────────────
   配色不是固定的：--bg / --accent 這些每一拍由 JS 依「今天過掉多少」
   在 OKLCH 上內插後寫進來（見 script 的 applyPressure）。這裡只放起始值，
   代表 p = 0（白天、最平靜）的樣子。
   ───────────────────────────────────────────────────────────────────── */
:root{
  --bg:oklch(0.160 0.028 158);
  --hero-bg:oklch(0.180 0.028 158);
  --bar-bg:oklch(0.130 0.028 158);
  --sheet-bg:oklch(0.175 0.028 158);
  --accent:oklch(0.860 0.200 148);
  --accent-deep:oklch(0.860 0.200 148);
  --accent-tint:oklch(0.860 0.200 148 / 0.10);
  --on-accent:#0b0f14;

  --ink-rgb:233,237,244;   /* 明暗共用的墨色三元組；applyPressure() 每拍依主題改寫 */
  --ink:#e9edf4;
  --ink-55:rgba(233,237,244,.55);
  --ink-48:rgba(233,237,244,.48);
  --ink-42:rgba(233,237,244,.42);
  --hair:rgba(233,237,244,.10);
  --hair-2:rgba(233,237,244,.18);
  --hair-3:rgba(233,237,244,.08);
  --fill:rgba(233,237,244,.07);
  --paper:var(--sheet-bg);
  --field:var(--hero-bg);
  --on-dark:#e9edf4;
  --on-dark-accent:var(--accent);

  --glow-sm:0 0 4px oklch(0.860 0.200 148 / 0.25);
  --glow-big:0 0 8px oklch(0.860 0.200 148 / 0.20);
  --glow-box:0 0 6px oklch(0.860 0.200 148 / 0.12);
  --scan-op:0;
  --vignette:transparent;

  --fh:"Chakra Petch","Helvetica Neue",system-ui,sans-serif;
  --fb:"IBM Plex Sans","Helvetica Neue",system-ui,sans-serif;
}

/* ── After Hours 動態 ─────────────────────────────────────────────────── */
@keyframes n-breathe{0%,100%{opacity:1}50%{opacity:.72}}
@keyframes n-flick{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}98%{opacity:.7}}
@keyframes n-creep{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@keyframes n-spark{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}40%{transform:translate(-50%,-50%) scale(1.45);opacity:.75}70%{transform:translate(-50%,-50%) scale(.85);opacity:1}}
@keyframes n-ember{0%{transform:translate(-50%,-50%) scale(1);opacity:.9}100%{transform:translate(calc(-50% + 14px),calc(-50% - 11px)) scale(.2);opacity:0}}
@keyframes n-shake{0%,100%{transform:translate(0,0)}12%{transform:translate(-3px,2px)}25%{transform:translate(3px,-2px)}38%{transform:translate(-2px,-3px)}50%{transform:translate(2px,3px)}62%{transform:translate(-3px,-1px)}75%{transform:translate(3px,1px)}88%{transform:translate(-1px,3px)}}
@keyframes n-rattle{0%,100%{transform:translate(0,0)}12%{transform:translate(-2.5px,1.5px)}25%{transform:translate(2.5px,-1.5px)}38%{transform:translate(-1.5px,-2.5px)}50%{transform:translate(1.5px,2.5px)}62%{transform:translate(-2.5px,-1px)}75%{transform:translate(2.5px,1px)}88%{transform:translate(-1px,2.5px)}}
@keyframes n-flare{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}50%{transform:translate(-50%,-50%) scale(1.9);opacity:.25}}
@keyframes n-bombpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* 螢幕上的掃描線與暗角，強度也跟著壓力走 */
.scan,.vig{position:fixed;inset:0;pointer-events:none;z-index:60}
.scan{opacity:var(--scan-op);
  background:repeating-linear-gradient(to bottom,#000 0 1px,transparent 1px 3px)}
.vig{background:var(--vignette)}

/* 迷彩／野戰：全畫面斑塊、掃描線、角標、警戒條 */
html[data-skin="camo"] body{
  background-image:
    radial-gradient(ellipse 58% 42% at 6% 10%, var(--camo-a), transparent 68%),
    radial-gradient(ellipse 48% 52% at 94% 6%, var(--camo-b), transparent 70%),
    radial-gradient(ellipse 62% 38% at 72% 92%, var(--camo-c), transparent 68%),
    radial-gradient(ellipse 44% 34% at 18% 78%, var(--camo-d), transparent 68%),
    radial-gradient(ellipse 36% 28% at 48% 42%, var(--camo-e), transparent 70%);
}
html[data-skin="camo"] .scan{
  background:
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.32) 3px 4px),
    repeating-linear-gradient(90deg,transparent 0 18px,rgba(190,200,120,.12) 18px 19px),
    repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,0,0,.08) 10px 11px);
}
html[data-skin="camo"] .brand{
  letter-spacing:.18em;text-shadow:none;font-weight:700;
  border:1px solid var(--camo-line);padding:4px 9px 3px;
  background:var(--camo-plate);
  box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.10);
}
html[data-skin="camo"] .brand::before{content:"◇ ";opacity:.75;letter-spacing:0}
html[data-skin="camo"] .kicker,
html[data-skin="camo"] .kicker-s{
  letter-spacing:.32em;text-shadow:none;font-weight:700;
}
html[data-skin="camo"] .num{
  letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
}
html[data-skin="camo"] #hero{
  background-color:var(--hero-bg);
  background-image:
    linear-gradient(90deg, var(--camo-line) 0 2px, transparent 2px),
    linear-gradient(0deg, var(--camo-line) 0 1px, transparent 1px),
    radial-gradient(ellipse 42% 36% at 12% 28%, var(--camo-h1), transparent 70%),
    radial-gradient(ellipse 38% 40% at 78% 18%, var(--camo-h2), transparent 72%),
    radial-gradient(ellipse 50% 34% at 58% 78%, var(--camo-h3), transparent 70%),
    radial-gradient(ellipse 30% 28% at 30% 70%, var(--camo-h4), transparent 70%);
  background-size:100% 100%, 100% 10px, auto, auto, auto, auto;
  border-color:var(--camo-line) !important;
}
html[data-skin="camo"] .tabs{
  border-top-color:var(--camo-line);
  background:linear-gradient(180deg, var(--camo-t1), var(--camo-t2));
}
html[data-skin="camo"] .tabs button{
  letter-spacing:.06em;font-weight:600;text-transform:uppercase;font-size:9.5px;
}
html[data-skin="camo"] .btn-fill{
  background:linear-gradient(180deg, oklch(0.42 0.08 122), oklch(0.32 0.07 115));
  border-color:var(--camo-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 1px rgba(var(--ink-rgb),.10);
}
html[data-skin="camo"] .card,
html[data-skin="camo"] .field,
html[data-skin="camo"] .row{
  border-color:var(--camo-line);
}
.camo-hud{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:10px;padding:7px 8px;border:1px dashed var(--camo-line);
  background:var(--camo-plate);
  font:600 9px/1 var(--fh);letter-spacing:.16em;color:var(--accent);text-transform:uppercase;
}
.camo-hud span{white-space:nowrap}
.camo-brackets{position:relative}
.camo-brackets::before,.camo-brackets::after{
  content:"";position:absolute;width:16px;height:16px;border-color:var(--accent);border-style:solid;opacity:.8;z-index:3;pointer-events:none;
}
.camo-brackets::before{top:5px;left:5px;border-width:2px 0 0 2px}
.camo-brackets::after{bottom:5px;right:5px;border-width:0 2px 2px 0}
.camo-brackets .c-tr,.camo-brackets .c-bl{
  position:absolute;width:16px;height:16px;border-color:var(--accent);border-style:solid;opacity:.8;z-index:3;pointer-events:none;display:block;
}
.camo-brackets .c-tr{top:5px;right:5px;border-width:2px 2px 0 0}
.camo-brackets .c-bl{bottom:5px;left:5px;border-width:0 0 2px 2px}
.camo-mark{
  position:absolute;right:18px;top:52%;transform:translateY(-50%) rotate(-18deg);
  font:700 42px/1 var(--fh);letter-spacing:.2em;color:var(--accent);opacity:.07;
  pointer-events:none;z-index:0;white-space:nowrap;user-select:none;
}
.camo-reticle{
  position:absolute;inset:16% 10% 26% 10%;pointer-events:none;opacity:.4;z-index:1;
  background:
    linear-gradient(var(--accent),var(--accent)) center/100% 1px no-repeat,
    linear-gradient(var(--accent),var(--accent)) center/1px 100% no-repeat;
  mask-image:radial-gradient(circle at center, transparent 40%, #000 41% 56%, transparent 57%);
  -webkit-mask-image:radial-gradient(circle at center, transparent 40%, #000 41% 56%, transparent 57%);
}
.camo-stripe{
  height:4px;margin:0 -20px 12px;opacity:.9;
  background:repeating-linear-gradient(135deg,
    oklch(0.58 0.14 85) 0 9px, oklch(0.12 0.02 90) 9px 18px);
}
.camo-rank{
  display:inline-flex;gap:3px;align-items:center;vertical-align:middle;margin-left:8px;
}
.camo-rank i{
  display:block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;
  border-bottom:6px solid var(--accent);opacity:.85;
}

/* 減少動態偏好：停在靜態，不閃不抖 */
@media (prefers-reduced-motion:reduce){
  *{animation:none !important}
  .scan{display:none}
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--ink);font-family:var(--fb);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border-radius:0;touch-action:manipulation}
input{border-radius:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-tint)}

/* ── shell ───────────────────────────────────────────────────────────── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.bar{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 8px;
}
.brand{font:600 15px/1 var(--fh);letter-spacing:.2em;color:var(--accent);text-shadow:var(--glow-sm)}
.date{font:400 10.5px/1 var(--fb);letter-spacing:.06em;color:var(--ink-42)}
.langsw{display:flex;border:1px solid var(--hair-2)}
.langsw button{border:none;padding:4px 9px;font:600 10px/1.4 var(--fh);letter-spacing:.1em;background:transparent}
.langsw button.on{background:var(--accent);color:var(--on-accent)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 20px 34px}
.tabs{
  flex:none;display:flex;border-top:1px solid var(--hair);background:var(--bar-bg);
  padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 12px);
}
.tabs button{
  flex:1;border:none;background:transparent;display:flex;flex-direction:column;
  align-items:center;gap:5px;padding:2px 0;min-height:44px;color:var(--ink-42);
}
.tabs button.on{color:var(--accent);text-shadow:var(--glow-sm)}
.tabs .lbl{font:500 9.5px/1 var(--fb);letter-spacing:.06em}
.ic{width:13px;height:13px;display:flex}
.ic-today{border:1px solid currentColor;align-items:flex-end;padding:1px}
.ic-today i{width:4px;height:4px;background:currentColor;display:block}
.ic-receipt{flex-direction:column;justify-content:space-between;padding:1px 0}
.ic-receipt i{height:1px;background:currentColor;display:block}
.ic-insights{align-items:flex-end;gap:2px}
.ic-insights i{background:currentColor;display:block;width:3px}
.ic-shop{width:16px;height:14px;border:1.5px solid currentColor;border-top:none;position:relative;box-sizing:border-box}
.ic-shop::before{
  content:"";position:absolute;left:-2px;right:-2px;top:-5px;height:5px;
  border:1.5px solid currentColor;border-bottom:none;
  clip-path:polygon(0 100%, 12% 0, 88% 0, 100% 100%);
  background:transparent;
}
.ic-shop i{display:none}
.ic-settings{border:1px solid currentColor;border-radius:50%}

/* ── primitives ──────────────────────────────────────────────────────── */
.kicker{font:600 9.5px/1 var(--fh);letter-spacing:.22em;text-transform:uppercase;color:var(--accent);text-shadow:var(--glow-sm)}
.kicker-s{font:600 9px/1 var(--fh);letter-spacing:.20em;color:var(--accent)}
.h-screen{font:600 25px/1 var(--fh)}
.muted{color:var(--ink-55)}
.foot{font:400 10.5px/1.7 var(--fb);color:var(--ink-42)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.blueprint{position:relative;border:1px solid var(--hair)}
.blueprint>i.c{display:none}
.blueprint>i.c::before,.blueprint>i.c::after{content:"";position:absolute;background:currentColor}
.blueprint>i.c::before{left:5px;top:0;width:1px;height:100%}
.blueprint>i.c::after{top:5px;left:0;width:100%;height:1px}
.blueprint>i.tl{top:-6px;left:-6px}.blueprint>i.tr{top:-6px;right:-6px}
.blueprint>i.bl{bottom:-6px;left:-6px}.blueprint>i.br{bottom:-6px;right:-6px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font:600 14px/1.2 var(--fh);background:transparent;border:1px solid var(--hair);
  padding:9px 13px;min-height:38px;
}
.btn:active{background:var(--fill)}
.btn-ghost{border-color:transparent;color:var(--accent-deep)}
.btn-fill{border:none;background:var(--accent);color:var(--on-accent);letter-spacing:.06em}
.btn-wide{width:100%;padding:14px 0;font-size:15px}
.line{border:none;border-bottom:1px solid var(--hair-2);background:transparent;
  width:100%;padding:6px 0;font:400 16px/1.5 var(--fb);outline:none;-webkit-appearance:none}
.line:focus{border-bottom-color:var(--accent)}
.chip{border:1px solid var(--hair-2);background:transparent;padding:7px 10px;
  font:400 12px/1.2 var(--fb);color:rgba(var(--ink-rgb),.6);min-height:34px}
.chip.on{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep)}
.sw{width:46px;height:24px;flex:none;border:1px solid rgba(var(--ink-rgb),.25);padding:2px;display:flex;background:transparent}
.sw i{width:18px;height:18px;display:block;background:rgba(var(--ink-rgb),.2)}
.sw.on{background:var(--accent);justify-content:flex-end;border-color:var(--accent)}
.sw.on i{background:var(--bg)}
.seg{display:flex;border:1px solid var(--hair-2)}
.seg button{flex:1;border:none;background:transparent;padding:10px 0;font:400 12px var(--fb);min-height:40px}
.seg button+button{border-left:1px solid var(--hair-2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 0;border-top:1px solid rgba(var(--ink-rgb),.14)}
.row .k{font:400 13.5px/1.5 var(--fb)}
.row .v{font:400 12.5px/1.5 var(--fb);color:rgba(var(--ink-rgb),.5);text-align:right}
.sechead{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:8px;border-bottom:1px solid var(--hair-2)}


/* ── 商店（貨架佈局）───────────────────────────────────────────────────
   只有這一頁用這組色票與圓角，刻意跟主畫面的壓力色階分開。 */
/* 商店的配色一律接到主題 token（--s-gold 由 applyPressure() 依明暗給），
   不要再寫死深色 —— 換主題時商店要跟著換 */
.shop{--s-bg:var(--bg);--s-panel:var(--field);--s-neon:var(--accent);
  --s-ink:var(--ink);--s-dim:rgba(var(--ink-rgb),.45);--s-line:var(--hair-3);
  font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--s-ink);
  margin:0 -20px;padding:0 0 8px;background:var(--s-bg);min-height:100%}
.shop .mono{font-family:'JetBrains Mono',monospace}
.shop .pix{font-family:Silkscreen,monospace}
.shop-pad{padding:0 18px}
.shop-wallet{border-radius:20px;padding:16px 18px;margin-bottom:24px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--field),var(--bg));border:1px solid var(--accent-24)}
.shop-wallet::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  border-radius:999px;background:radial-gradient(circle,var(--accent-24),transparent 70%)}
.shop-rail{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:0 18px 22px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.shop-rail::-webkit-scrollbar{display:none}
.shop-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 18px;margin-bottom:10px}
.shop-head .t{font-size:14px;font-weight:700}
.shop-head .t span{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(var(--ink-rgb),.56)}
.shop-card{flex:none;background:var(--s-panel);border:1px solid var(--hair);border-radius:18px;padding:10px}
.shop-btn{border-radius:12px;padding:10px;font-size:12.5px;font-weight:700;text-align:center;
  border:1px solid transparent;background:var(--s-neon);color:var(--s-bg)}
.shop-btn.ghost{background:transparent;border-color:var(--accent-30);color:var(--s-neon);font-weight:600}
.shop-pet{flex:none;width:118px;background:transparent;border:none;padding:0;text-align:left}
.shop-pet .art{width:118px;height:118px;border-radius:16px;border:1px solid var(--hair-3);
  background:repeating-linear-gradient(135deg,rgba(var(--ink-rgb),.07) 0 6px,transparent 6px 12px),var(--field);
  display:grid;place-items:center;font-size:46px;margin-bottom:8px}
.shop-pet.own .art{border-color:var(--accent-40)}
.shop-pet .nm{font-size:12px;font-weight:600}
.shop-pet .pr{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--s-neon);margin-top:3px}
.shop-skin{width:172px;text-align:left}
.shop-skin .prev{width:100%;height:92px;border-radius:11px;display:flex;align-items:flex-end;
  padding:11px;margin-bottom:9px;box-sizing:border-box}
.shop-consum{display:flex;align-items:center;gap:13px;border-radius:16px;border:1px solid var(--hair-3);
  background:var(--s-panel);padding:14px;margin:0 18px 26px}


/* 商店改成跟著主題之後，上下導覽列不需要再被蓋成固定深色了 */

/* ── sheets ──────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(29,45,61,.45);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--bg);border-top:1px solid rgba(var(--ink-rgb),.25);
  padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 40px);
  max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:up .22s ease-out}
@keyframes up{from{transform:translateY(14px)}to{transform:translateY(0)}}
.full{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 40px) 24px calc(env(safe-area-inset-bottom,0px) + 28px)}

input[type=range]{width:100%;accent-color:var(--accent)}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   86,400 — 時間覺察 App (PWA)
   單檔、無建置；資料存在 localStorage。離線靠同目錄的 sw.js。
   現行皮膚：After Hours（design_handoff/PrototypeNeon.dc.html）
   ══════════════════════════════════════════════════════════════════ */

/* ── 1. 語言字典 ─────────────────────────────────────────────────────── */
const T = {
  left_today:      ['今天剩下','Seconds left today'],
  sec:             ['秒','sec'],
  anchor_q:        ['如果今天只能好好完成一件事，會是什麼？','If you could do one thing well today, what would it be?'],
  anchor_ph:       ['例如：把提案的第三段寫完','e.g. finish part three of the proposal'],
  anchor_foot:     ['午夜前若還停在「進行中」，引線上的牠會被炸掉。','If it is still in progress at midnight, whatever sits on the fuse gets blown up.'],
  anchor_save:     ['儲存','Save'],
  anchor_cancel:   ['取消','Cancel'],
  anchor_edit:     ['編輯','Edit'],
  anchor_unsaved:  ['尚未儲存','Not saved yet'],

    .filter(b => b.startedAt && b.endedAt && b.endedAt > b.startedAt)
    .map(b => [b.startedAt, b.endedAt])
    .sort((a,b) => a[0] - b[0]);
  if(!ranges.length) return 0;
  let total = 0, curS = ranges[0][0], curE = ranges[0][1];
  for(let i = 1; i < ranges.length; i++){
    const [s, e] = ranges[i];
    if(s <= curE) curE = Math.max(curE, e);
    else { total += curE - curS; curS = s; curE = e; }
  }
  total += curE - curS;
  return Math.round(total / 1000);
}

/* 一天的統計 ------------------------------------------------------------ */
function stats(k){
  const day = dayOf(k);
  const done = day.blocks.filter(b => b.endedAt);
  const named = namedUnionSec(done);
  const isToday = k === dayKey();
  const passed = isToday ? secPassed() : 86400;
  const byCat = {};
  done.forEach(b => { byCat[b.cat] = (byCat[b.cat]||0) + blockDur(b); });
  const counts = {}; WORTHS.forEach(w => counts[w] = done.filter(b => b.worth === w).length);
  return { day, done, named, unnamed: Math.max(0, passed - named), passed, byCat, counts };
}

// 排定開始時刻：'now' 或 sheet 上指定的 HH:MM（已經過去的時間就退回現在）
function spendStartAt(){
  const sp = ui.spend, now = Date.now();
  if(sp.when !== 'at' || !sp.at) return now;
  const [h,m] = sp.at.split(':').map(Number);
  const d = new Date(); d.setHours(h||0, m||0, 0, 0);
  return d.getTime() <= now ? now : d.getTime();
}
function createBlock(){
  const sp = ui.spend;
  const mins = sp.isCustom ? sp.custom : sp.min;
  const start = spendStartAt();
  const isNow = start - Date.now() < 1000;
  let end = start + mins*60000;
  if(end > dayEnd()) end = dayEnd() - 1000;          // 跨午夜 → 23:59:59 自動結束
  const cat = sp.cat || S.cats[0] || 'work';
  const b = { id:'b'+Date.now()+Math.floor(Math.random()*1000),
              name: sp.name.trim() || catName(cat), cat, plannedSec:mins*60,
              startAt:start, endAt:end, startedAt:null, endedAt:null,
              worth:null, note:'', again:false, link:sp.link, day:dayKey() };
  today().blocks.push(b);
  if(isNow && !activeBlock()){ b.startedAt = start; S.activeId = b.id; }
  ui.sheet = null;
  ui.spend = {min:15,custom:30,isCustom:false,name:'',cat:null,link:false,when:'now',at:'',warn:false};
  setState(()=>{});
}
function startScheduled(id){

  a.endedAt = Math.min(Date.now(), a.endAt || Date.now());

function migrateState(raw){
  const s = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), raw || {});
  s.notif = Object.assign({}, DEFAULTS.notif, s.notif || {});
  if(typeof s.days !== 'object' || !s.days || Array.isArray(s.days)) s.days = {};
  // 壞掉的一天只丟那一天，不能連累整份存檔（以前這裡會丟例外，load() 就整個清空）
  Object.keys(s.days).forEach(k => {
    const day = s.days[k];
    if(!day || typeof day !== 'object' || Array.isArray(day)){ delete s.days[k]; return; }
    if(!Array.isArray(day.blocks)) day.blocks = [];
    if(!Array.isArray(day.tomorrow)) day.tomorrow = [];
    if(!day.anchor || typeof day.anchor !== 'object') day.anchor = { text:'', state:'doing' };
    day.blocks = day.blocks.filter(b => b && typeof b === 'object');
    day.blocks.forEach(b => { if(b.startedAt === undefined) b.startedAt = b.startAt; });
  });
  if(s.active){ s.activeId = s.active.id; delete s.active; }
  if(typeof s.night !== 'boolean') s.night = true;
  if(!s.fired || typeof s.fired !== 'object' || Array.isArray(s.fired)) s.fired = {};
  if(typeof s.firedDay !== 'string') s.firedDay = '';
  if(!Array.isArray(s.cats) || !s.cats.length) s.cats = DEFAULTS.cats.slice();
  if(!Array.isArray(s.nextWeek)) s.nextWeek = [];
  if(typeof s.coins !== 'number' || s.coins < 0) s.coins = 400;
  // 測試階段：既有存檔金幣低於預設時補到 400，方便開商店
  if(s.coins < 400) s.coins = 400;
  if(!Array.isArray(s.ownedPets)) s.ownedPets = FREE_PET_IDS.slice();
  // 舊 id「elephant／小人象」更正為人物「figure／小人像」
  s.ownedPets = s.ownedPets.map(id => id === 'elephant' ? 'figure' : id);
  if(s.equippedPet === 'elephant') s.equippedPet = 'figure';
  if(s.companion && s.companion.petId === 'elephant') s.companion.petId = 'figure';
  if(Array.isArray(s.fallen)) s.fallen.forEach(f => { if(f && f.petId === 'elephant') f.petId = 'figure'; });
  FREE_PET_IDS.forEach(id => { if(s.ownedPets.indexOf(id) < 0) s.ownedPets.push(id); });
  // 去掉已廢棄的 elephant id
  s.ownedPets = s.ownedPets.filter(id => id !== 'elephant');
  if(!PETS.some(p => p.id === s.equippedPet)) s.equippedPet = 'bomb';
  if(s.ownedPets.indexOf(s.equippedPet) < 0) s.equippedPet = 'bomb';
  if(!s.companion || typeof s.companion !== 'object'){
    s.companion = { petId:s.equippedPet, startedOn:dayKey(), days:1, tasks:[] };
  }else{
    if(!s.companion.petId) s.companion.petId = s.equippedPet;
    if(!s.companion.startedOn) s.companion.startedOn = dayKey();
    if(typeof s.companion.days !== 'number' || s.companion.days < 1) s.companion.days = 1;
    if(!Array.isArray(s.companion.tasks)) s.companion.tasks = [];
  }
  if(!Array.isArray(s.fallen)) s.fallen = [];
  if(!s.coinLog || typeof s.coinLog !== 'object') s.coinLog = {};
  if(!s.petSettled || typeof s.petSettled !== 'object') s.petSettled = {};
  if(!Array.isArray(s.ownedSkins)) s.ownedSkins = FREE_SKIN_IDS.slice();
  FREE_SKIN_IDS.forEach(id => { if(s.ownedSkins.indexOf(id) < 0) s.ownedSkins.push(id); });
  if(!SKINS.some(x => x.id === s.equippedSkin)) s.equippedSkin = 'neon';
  if(s.ownedSkins.indexOf(s.equippedSkin) < 0) s.equippedSkin = 'neon';
  if(['auto','day','night'].indexOf(s.appearance) < 0) s.appearance = 'auto';
  if(!s.account || typeof s.account !== 'object'){
    s.account = { mode:'guest', name:'', passHash:'', salt:'', session:true };
  }else{
    if(s.account.mode !== 'local' && s.account.mode !== 'guest') s.account.mode = 'guest';
    if(typeof s.account.session !== 'boolean') s.account.session = true;
    if(typeof s.account.name !== 'string') s.account.name = '';
    if(typeof s.account.passHash !== 'string') s.account.passHash = '';
    if(typeof s.account.salt !== 'string') s.account.salt = '';
  }
  if(typeof s.homeTip !== 'boolean') s.homeTip = false; // 舊使用者不重噴首頁提示
  return s;
}
function importBackup(file){
  if(!file) return;
  if(!confirm(t('confirm_import'))) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('shape');
      if(data.days !== undefined && (typeof data.days !== 'object' || Array.isArray(data.days)))
        throw new Error('days');
      S = migrateState(data);
      resetUiState();
      lastSkin = ''; lastStage = null;
      save(); applyPressure(); render();
      alert(t('import_ok'));
    }catch(e){ alert(t('import_bad')); }
  };
  reader.onerror = () => alert(t('import_bad'));
  reader.readAsText(file);
}

function tFill(key, map){

function ensureCompanion(){

function rewardBlockDone(b){
  if(!b || b.demo) return;
  const log = coinDayLog(b.day || dayKey());
  if(log.blocks[b.id]) return;
  log.blocks[b.id] = true;

function dayTasksFailed(k){
  const day = dayOf(k);
  if(!day) return false;
  const a = day.anchor;
  // Anchor 設了卻還停在進行中＝情緒勒索觸發點
  if(a && a.text && a.text.trim() && a.state === 'doing') return true;
  // 只有「已開始、未結束」算失敗；已排定但還沒開始的不算
  return (day.blocks || []).some(b => !b.demo && b.startedAt && !b.endedAt);
}
function dayHadTasks(k){
  const day = dayOf(k);
  if(!day) return false;
  if(day.anchor && day.anchor.text && day.anchor.text.trim()) return true;
  return (day.blocks || []).some(b => !b.demo);
}
function startCompanion(petId, onDay){
  S.equippedPet = petId;
  S.companion = { petId, startedOn: onDay || dayKey(), days:1, tasks:[] };
}
// 補算舊日子時 endedOn 是過去的日期，新陪伴要從「牠死掉的隔天」算起，
// 不能用 dayKey()，否則櫃子裡會出現開始日期晚於結束日期的紀念卡
function nextDayKey(k){
  const [y,m,d] = String(k).split('-').map(Number);
  if(!y || !m || !d) return dayKey();
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + 1);
  const nk = dayKey(dt);
  return nk > dayKey() ? dayKey() : nk;      // 不會排到未來
}
function explodeCompanion(endedOn){
  ensureCompanion();
  const c = S.companion;
  const name = petName(c.petId);
  const ended = endedOn || dayKey();
  S.fallen.unshift({
    id:'f'+Date.now()+Math.floor(Math.random()*1000),
    petId:c.petId, startedOn:c.startedOn, endedOn:ended,
    days: Math.max(1, c.days|0), tasks:(c.tasks || []).slice()
  });
  // 寵物仍在 ownedPets；引線回到預設炸彈，從隔天開始新的陪伴
  startCompanion('bomb', nextDayKey(ended));
  showPetToast(tFill('pet_blown_note', {name}));
}
function settlePetDay(k){
  if(!k || S.petSettled[k]) return;
  S.petSettled[k] = true;
  ensureCompanion();
  // 當天完全沒有任務 → 不炸，也不強制加天（安靜的一天）
  if(!dayHadTasks(k)) return;
  if(dayTasksFailed(k)){
    explodeCompanion(k);
  }else{
    S.companion.days = Math.max(1, (S.companion.days|0) + 1);
  }
}
/* 關掉 App 跨過午夜時，下次開啟要把漏掉的日子結算完 */
function catchUpPetSettlement(){
  const todayK = dayKey();
  const before = S.fallen.length;
  // 先結算（未收尾的進行中＝失敗→炸掉），再清掉跨日殘留的 activeId
  Object.keys(S.days || {}).filter(k => k < todayK && !S.petSettled[k]).sort()
    .forEach(settlePetDay);
  // 一次炸掉好幾隻時，explodeCompanion 的 toast 只會留下最後一句 —— 改成一起交代
  const lost = S.fallen.length - before;
  if(lost > 1){
    const names = S.fallen.slice(0, lost).reverse().map(f => petName(f.petId));
    showPetToast(tFill('pet_blown_many', {n:lost, names:names.join(EN() ? ', ' : '、')}));
  }
  const act = activeBlock();
  if(act && act.day && act.day < todayK){
    if(!act.endedAt) act.endedAt = Math.min(Date.now(), act.endAt || Date.now());
    S.activeId = null;
  }else if(S.activeId && !activeBlock()){
    S.activeId = null;
  }
}

/* ── 本機帳戶（無後端；密碼只保護這台裝置上的存檔） ─────────────────── */
function hashPass(pass, salt){
  let h = 2166136261;
  const s = String(salt) + '|' + String(pass);
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}
function needsLogin(){

}

function registerLocalAccount(){

  const pass = ui.auth.pass || '';
  const pass2 = ui.auth.pass2 || '';
  if(S.account && S.account.mode === 'local' && S.account.passHash){
    ui.auth.err = t('acct_exists'); return false;
  }
  if(!name){ ui.auth.err = t('acct_need_name'); return false; }
  if(pass.length < 4){ ui.auth.err = t('acct_need_pass'); return false; }
  if(pass !== pass2){ ui.auth.err = t('acct_pass_mismatch'); return false; }
  const salt = 's' + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);
  S.account = { mode:'local', name, passHash:hashPass(pass, salt), salt, session:true };
  ui.auth = { name:'', pass:'', pass2:'', mode:'register', err:'' };
  showPetToast(tFill('acct_welcome', {name}));
  return true;
}
function loginLocalAccount(){
  const name = (ui.auth.name || '').trim();
  const pass = ui.auth.pass || '';
  if(!(S.account && S.account.mode === 'local' && S.account.passHash)){
    ui.auth.err = t('acct_no_account'); return false;
  }
  if(name !== S.account.name || hashPass(pass, S.account.salt) !== S.account.passHash){
    ui.auth.err = t('acct_bad_login'); return false;
  }
  S.account.session = true;
  ui.auth = { name:'', pass:'', pass2:'', mode:'login', err:'' };
  showPetToast(tFill('acct_welcome', {name:S.account.name}));
  return true;
}
function logoutLocalAccount(){
  if(!(S.account && S.account.mode === 'local')) return;
  setState(()=>{ S.account.session = false; ui.sheet = null; });
}

/* ── 5a. Today ──────────────────────────────────────────────────────── */
function nowClock(){
  const e = elapsedToday();
  return p2(Math.floor(e/3600))+':'+p2(Math.floor(e%3600/60))+(S.tick ? ':'+p2(e%60) : '');
}
function clockHtml(){
  return '<div id="cdClock" class="num" style="font:600 15px/1 var(--fh);letter-spacing:.06em;'
    + 'color:var(--ink-55)">'+nowClock()+'</div>';
}
function moodLine(){
  const m = skinOf().mood;
  const pick = row => row[EN()?1:0];
  const p = pressure();
  if(fuseOut()) return pick(m.fuse);
  if(p < 0.25) return pick(m.early);
  if(p < 0.60) return pick(m.mid);
  if(p < 0.85) return pick(m.late);
  return pick(m.end);
}
// 倒數的四個階段：靜止 → 閃爍 → 呼吸 → 抖動
function heroAnim(){
  const p = pressure();
  if(fuseOut()) return 'n-shake .22s linear infinite, n-breathe 1.1s ease-in-out infinite';
  if(p > 0.8)   return 'n-breathe 2.6s ease-in-out infinite';
  if(p > 0.55)  return 'n-flick 7s linear infinite';
  return 'none';
}
/* 進度條是一條引線，不是進度條：角色在左端不動，火花沿著剩下的繩子
   由右往左燒回來，燒完就是午夜。預設是炸彈，可在寵物櫃換成其他角色。 */
function fuseBombVisual(p, out, r, tip, shell){
  ensureCompanion();
  const pet = petOf(S.equippedPet || 'bomb');
  const anim = out ? 'n-rattle .22s linear infinite' : p > 0.75 ? 'n-bombpulse 1.4s ease-in-out infinite' : 'none';
  if(pet.id === 'bomb'){
    return '<div id="fuseBomb" style="flex:none;width:22px;height:22px;position:relative;animation:'+anim+'">'
      + '<div style="position:absolute;right:-8px;top:9px;width:10px;height:4px;background:rgba(var(--ink-rgb),'+(0.34+p*0.2).toFixed(2)+')"></div>'
      + '<div style="position:absolute;left:1px;top:1px;width:20px;height:20px;border-radius:50%;'
      +   'background:radial-gradient(circle at 34% 32%, '+ok([r.bg[0]+0.1,r.bg[1],r.bg[2]])+', '+shell+' 75%);'
      +   'border:1px solid '+tip+';'
      +   'box-shadow:inset 0 -3px 6px rgba(0,0,0,.7), 0 0 '+(6+p*22+(out?18:0)).toFixed(0)+'px '+ok(r.neon,(0.15+p*0.6).toFixed(2))+'"></div>'
      + '<div style="position:absolute;left:6px;top:6px;width:4px;height:4px;border-radius:50%;background:rgba(var(--ink-rgb),.26)"></div>'
      + '</div>';
  }
  // 其他角色：emoji 佔位，仍接在引線左端
  return '<div id="fuseBomb" title="'+esc(petName(pet.id))+'" style="flex:none;width:26px;height:26px;position:relative;'
    + 'display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;'
    + 'filter:drop-shadow(0 0 '+(4+p*14+(out?10:0)).toFixed(0)+'px '+ok(r.neon,(0.25+p*0.45).toFixed(2))+');'
    + 'animation:'+anim+'">'+pet.emoji+'</div>';
}
function fuseHtml(){
  const p = pressure(), out = fuseOut(), r = ramp(p);
  // 夜間強度關掉 → p 為 0：火花／flare／ember 必須完全靜止（規則不可只關一半）
  const calm = p <= 0;
  const rem = (100 - pctToday()).toFixed(2) + '%';
  // 錨點 #fusePin 只負責 left%；火花／光暈在錨點內以 0,0 為中心，避免 refresh 覆寫 animation transform
  const tipPin = 'position:absolute;left:0;top:0;transform:translate(-50%,-50%);';
  const neon = ok(r.neon);
  const ember = calm ? '0' : (0.45 + p*0.5).toFixed(2);
  const shell = ok([Math.max(0.06, r.bg[0] - 0.04), r.bg[1], r.bg[2]]);
  const tip = out ? ok([0.96, 0.04, 85]) : ok(r.neon, (0.35 + p*0.5).toFixed(2));
  const sparkCore = ok([0.98, 0.02, r.neon[2]]);
  const animFlare = calm ? 'none' : 'n-flare .9s ease-in-out infinite';
  const animSpark = calm ? 'none' : 'n-spark .32s ease-in-out infinite';
  const ink = skinOf().light ? '28,26,23' : '233,237,244';
  const mil = !!skinOf().military;
  const ropeH = mil ? 4 : 5;
  const ropeTop = mil ? 2.5 : 2;
  const ashTop = (ropeTop + (ropeH - 3) / 2).toFixed(1);
  const dot = (size, bg, delay, dur) =>
    '<div style="'+tipPin+'width:'+size+'px;height:'+size+'px;border-radius:50%;'
    + 'background:'+bg+';opacity:'+ember+';animation:'
    + (calm ? 'none' : 'n-ember '+dur+'s ease-out '+delay+'s infinite')+'"></div>';
  return '<div style="display:flex;align-items:center;gap:6px;margin-top:22px">'
    + fuseBombVisual(p, out, r, tip, shell)
    // 引線
    + '<div id="fuseTrack" style="flex:1;height:9px;position:relative;'
    +   (mil ? 'background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(190,200,120,.18) 7px 8px)' : '')+'">'
    + '<div id="fuseRope" style="position:absolute;top:'+ropeTop+'px;left:0;height:'+ropeH+'px;width:'+rem+';'
    +   'background:repeating-linear-gradient(115deg, rgba('+ink+','+(0.16+p*0.1).toFixed(2)+') 0 3px, '
    +   'rgba('+ink+','+(0.34+p*0.2).toFixed(2)+') 3px 6px)'
    +   (mil ? ';border-top:1px solid rgba(190,200,120,.25);border-bottom:1px solid rgba(0,0,0,.35)' : '')+'"></div>'
    + '<div id="fuseAsh" style="position:absolute;top:'+ashTop+'px;right:0;height:3px;width:'+pctToday().toFixed(2)+'%;'
    +   'background:linear-gradient(to left, rgba('+ink+',.04), rgba('+ink+',.13))"></div>'
    + '<div id="fusePin" style="position:absolute;left:'+rem+';top:50%;width:0;height:0;pointer-events:none">'
    + '<div id="fuseFlare" style="'+tipPin+'width:'+(22+p*26+(out?16:0)).toFixed(0)+'px;'
    +   'height:'+(22+p*26+(out?16:0)).toFixed(0)+'px;border-radius:50%;'
    +   'background:radial-gradient(circle, '+ok(r.neon, calm ? '0.2' : '0.5')+' 0 30%, '+ok(r.neon,'0')+' 70%);'
    +   'animation:'+animFlare+'"></div>'
    + '<div id="fuseSpark" style="'+tipPin+'width:'+(9+p*8+(out?6:0)).toFixed(0)+'px;'
    +   'height:'+(9+p*8+(out?6:0)).toFixed(0)+'px;border-radius:50%;'
    +   'background:radial-gradient(circle at 50% 50%, '+sparkCore+' 0 35%, '+neon+' 70%, '+ok(r.neon,'0')+' 100%);'
    +   'box-shadow:0 0 '+(calm ? 0 : (10+p*18+(out?12:0))).toFixed(0)+'px '+(calm ? 0 : (3+p*4)).toFixed(0)+'px '+ok(r.neon,(0.55+p*0.35).toFixed(2))
    +   (calm ? '' : ', 0 0 3px 1px rgba(255,255,255,.9)')+';animation:'+animSpark+'"></div>'
    + '<div style="'+tipPin+'width:3px;height:3px;border-radius:50%;background:#fff;opacity:'+(calm?'.35':'.95')+';'
    +   'box-shadow:0 0 4px 1px '+ok(r.neon,'0.9')+'"></div>'
    + (calm ? '' : dot(3,sparkCore,0,1.1) + dot(2,neon,0.35,1.5) + dot(2,sparkCore,0.8,1.9))
    + '</div></div></div>';
}

/* Anchor 有四個明顯不同的樣子：編輯中 / 進行中 / 已完成 / 不再重要。
   存好之後就離開輸入狀態，要改得先按「編輯」。 */
function anchorMode(){
  const a = today().anchor;
  if(ui.anchorEdit || !a.text.trim()) return 'edit';
  return a.state === 'done' ? 'done' : a.state === 'dropped' ? 'dropped' : 'doing';
}
function anchorStatusText(){
  const a = today().anchor;
  if(anchorMode() === 'edit'){
    if(ui.anchorDraft !== null && ui.anchorDraft !== a.text) return t('anchor_unsaved');
    return a.text.trim() ? t('anchor_writing') : t('anchor_none');
  }
  if(a.state === 'done')    return t('st_done') + (a.doneAt ? ' · ' + clock(a.doneAt) : '');
  if(a.state === 'dropped') return t('st_dropped');
  return t('st_doing');
}
// 右上角的狀態標記：進行中＝描邊，已完成＝填滿，不再重要＝淡描邊
function anchorChip(mode){
  const txt = esc(anchorStatusText());
  const base = 'font:600 9px/1 var(--fh);letter-spacing:.14em;padding:5px 7px;flex:none;';
  if(mode === 'done')
    return '<div style="'+base+'background:var(--ink);color:var(--bg);border:1px solid var(--ink)">'+txt+'</div>';
  if(mode === 'dropped')
    return '<div style="'+base+'border:1px solid var(--hair);color:var(--ink-42)">'+txt+'</div>';
  if(mode === 'doing')
    return '<div style="'+base+'border:1px solid var(--accent);color:var(--accent-deep)">'+txt+'</div>';
  return '<div id="anchorStatus" style="font:400 10px/1 var(--fb);flex:none;color:'
    + (ui.anchorDraft !== null && ui.anchorDraft !== today().anchor.text
        ? 'var(--accent-deep)' : 'rgba(var(--ink-rgb),.45)')+'">'+txt+'</div>';
}
// 文字左邊的狀態方塊：空框 / 打勾 / 劃掉
function anchorMark(mode){
  const box = 'width:16px;height:16px;flex:none;margin-top:3px;display:flex;'
            + 'align-items:center;justify-content:center;';
  if(mode === 'done')
    return '<div style="'+box+'background:var(--ink)">'
      + '<span style="font:400 11px/1 var(--fb);color:var(--bg)">✓</span></div>';
  if(mode === 'dropped')
    return '<div style="'+box+'border:1px solid var(--hair)">'
      + '<span style="width:8px;height:1px;background:rgba(var(--ink-rgb),.42);display:block"></span></div>';
  return '<div style="'+box+'border:1px solid rgba(var(--ink-rgb),.35)"></div>';
}
function anchorHtml(){
  const a = today().anchor;
  const mode = anchorMode();
  const dirty = ui.anchorDraft !== null && ui.anchorDraft !== a.text;

  // 卡片本身也跟著狀態變：完成是淡藍底，不再重要整張退到背景去
  const skin = mode === 'done'    ? 'background:var(--accent-tint);border-color:var(--accent)'
             : mode === 'dropped' ? 'background:transparent;border-color:rgba(var(--ink-rgb),.10)'
             : 'background:transparent';
  const head = '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
    + '<div class="kicker" style="padding-top:2px">TODAY ANCHOR</div>' + anchorChip(mode) + '</div>';

  let body, actions, foot = '';
  if(mode === 'edit'){
    const shown = ui.anchorDraft !== null ? ui.anchorDraft : a.text;
    body = '<div style="font:400 11.5px/1.55 var(--fb);color:rgba(var(--ink-rgb),.5);margin-top:10px">'+esc(t('anchor_q'))+'</div>'

      + 'placeholder="'+esc(t('anchor_ph'))+'" value="'+esc(shown)+'">';
    actions = '<button id="anchorSave" class="btn'+(dirty?' btn-fill':'')+'" data-act="anchor-save" '
      +   'style="font-size:12px'+(dirty?'':';display:none')+'">'+esc(t('anchor_save'))+'</button>'
      + (a.text.trim()
          ? '<button class="btn btn-ghost" data-act="anchor-cancel" style="font-size:12px">'+esc(t('anchor_cancel'))+'</button>'
          : '');
    foot = '<div class="foot" style="margin-top:9px">'+esc(t('anchor_foot'))+'</div>';
  }else{
    const dim = mode === 'dropped';
    body = '<div style="display:flex;gap:10px;margin-top:12px">' + anchorMark(mode)
      + '<div style="flex:1;min-width:0;font:500 18px/1.4 var(--fb);'
      +   (dim ? 'color:var(--ink-42);text-decoration:line-through' : '')+'">'+esc(a.text)+'</div></div>';
    if(mode === 'doing'){
      actions = '<button class="btn" data-act="anchor-done" style="font-size:12px">'+esc(t('mark_done'))+'</button>'
        + '<button class="btn btn-ghost" data-act="anchor-drop" style="font-size:12px">'+esc(t('drop'))+'</button>'
        + '<button class="btn btn-ghost" data-act="anchor-edit" style="font-size:12px;margin-left:auto;color:rgba(var(--ink-rgb),.5)">'+esc(t('anchor_edit'))+'</button>';
      foot = '<div class="foot" style="margin-top:9px">'+esc(t('anchor_foot'))+'</div>';
    }else if(mode === 'done'){
      actions = '<button class="btn btn-ghost" data-act="anchor-done" style="font-size:12px">'+esc(t('mark_undone'))+'</button>'
        + '<button class="btn btn-ghost" data-act="anchor-edit" style="font-size:12px;margin-left:auto;color:rgba(var(--ink-rgb),.5)">'+esc(t('anchor_edit'))+'</button>';
    }else{
      actions = '<button class="btn btn-ghost" data-act="anchor-drop" style="font-size:12px">'+esc(t('restore'))+'</button>'
        + '<button class="btn btn-ghost" data-act="anchor-edit" style="font-size:12px;margin-left:auto;color:rgba(var(--ink-rgb),.5)">'+esc(t('anchor_edit'))+'</button>';
    }
  }
  return '<div class="blueprint" style="margin-top:26px;padding:15px 15px 13px;'+skin+'">' + corners()
    + head + body
    + '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center">'+actions+'</div>'
    + foot + '</div>';
}

function receiptCard(k){
  const st = stats(k), isToday = k === dayKey();

  const anchorSt = day.anchor.state === 'done' ? t('st_done')
                 : day.anchor.state === 'dropped' ? t('st_dropped') : t('st_doing');
  const catRows = Object.keys(st.byCat).sort((a,b)=>st.byCat[b]-st.byCat[a]).map(c => {
    const w = st.named ? (st.byCat[c]/st.named*100) : 0;
    return '<div style="display:flex;align-items:center;gap:9px;padding:3px 0">'
      + '<div style="width:58px;flex:none;font:400 11.5px/1.5 var(--fb);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(catName(c))+'</div>'
      + '<div style="flex:1;height:7px;background:rgba(var(--ink-rgb),.06)"><div style="height:7px;background:'+catTone(c)+';width:'+w.toFixed(1)+'%"></div></div>'
      + '<div class="num" style="width:52px;text-align:right;font:400 11px/1.5 var(--fb);color:rgba(var(--ink-rgb),.6);flex:none">'+minDur(st.byCat[c])+'</div></div>';
  }).join('') || '<div class="foot">'+esc(t('named_empty'))+'</div>';

      + '<div class="num" style="font:600 17px/1 var(--fh)'+(n?'':';color:rgba(var(--ink-rgb),.35)')+'">'+n+'</div>'
      + '<div style="font:400 9.5px/1.4 var(--fb);color:var(--ink-55)">'+esc(t(w))+'</div></div>';
  }).join('');

  const best = st.done.filter(b => b.worth === 'w_v' && b.note).slice(-1)[0];
  const tomorrow = day.tomorrow || [];
  const chips = S.cats.map(c =>
    '<button class="chip'+(tomorrow.indexOf(c)>=0?' on':'')+'" data-act="tomorrow" data-cat="'+c+'" data-day="'+k+'" '
    + 'style="font-size:11px;padding:6px 9px">'+esc(catName(c))+'</button>').join('');

  return '<div style="background:var(--sheet-bg);border:1px solid var(--hair-2);box-shadow:var(--glow-box);padding:20px 18px;margin-top:14px">'

    + '<div style="font:400 10px/1.4 var(--fb);letter-spacing:.2em;color:rgba(var(--ink-rgb),.5)">'+esc(t(isToday?'received_today':'received_day'))+'</div>'
    + '<div class="num" style="font:600 44px/1 var(--fh);margin-top:4px">86,400</div>'
    + '<div style="font:400 10.5px/1.4 var(--fb);color:rgba(var(--ink-rgb),.5);margin-top:4px">'+esc(dateFull(k))+'</div></div>'

    + '<div class="num" style="padding:12px 0;border-bottom:1px dashed rgba(var(--ink-rgb),.3)">'
    + '<div style="display:flex;justify-content:space-between;font:400 12.5px/1.9 var(--fb)"><span>'+esc(t(isToday?'elapsed_today':'elapsed_day'))+'</span><span>'+comma(st.passed)+'</span></div>'
    + '<div style="display:flex;justify-content:space-between;font:400 12.5px/1.9 var(--fb)"><span>'+esc(t(isToday?'left_plain':'left_day'))+'</span><span id="rcLeft">'+comma(isToday?secLeft():0)+'</span></div></div>'

    + '<div style="padding:12px 0;border-bottom:1px dashed rgba(var(--ink-rgb),.3)">'
    + '<div class="kicker-s">TODAY ANCHOR</div>'
    + '<div style="display:flex;justify-content:space-between;gap:10px;margin-top:6px;font:500 13.5px/1.5 var(--fb)">'
    + '<span>'+esc(anchorTxt)+'</span><span style="flex:none;color:rgba(var(--ink-rgb),.5);font-weight:400">'+esc(anchorSt)+'</span></div></div>'

    + '<div class="num" style="padding:12px 0;border-bottom:1px dashed rgba(var(--ink-rgb),.3)">'
    + '<div style="display:flex;justify-content:space-between;font:500 12.5px/1.9 var(--fb)"><span>'+esc(t('named_time'))+'</span><span>'+hmDur(st.named)+'</span></div>'
    + '<div style="display:flex;justify-content:space-between;font:400 12.5px/1.9 var(--fb);color:var(--ink-55)"><span>'+esc(t('unnamed'))+'</span><span id="rcUnnamed">'+hmDur(st.unnamed)+'</span></div>'
    + '<div style="display:flex;justify-content:space-between;font:400 12.5px/1.9 var(--fb);color:var(--ink-55)"><span>'+esc(t('times_named'))+'</span><span>'+st.done.length+'</span></div></div>'

/* ── 5c. Insights ───────────────────────────────────────────────────── */
function weekKeys(){
  const out = [];
  for(let i=6;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); out.push(dayKey(d)); }
  return out;
}
function screenInsights(){
  const keys = weekKeys();
  const per = keys.map(k => stats(k));
  const maxNamed = Math.max(1, ...per.map(s => s.named));
  const totalNamed = per.reduce((s,x)=>s+x.named,0);
  const anchorDone = keys.filter(k => dayOf(k).anchor.state === 'done').length;
  const hasAny = per.some(s => s.done.length) || anchorDone > 0;

  const bars = keys.map((k,i) => {
    const s = per[i], h = Math.round(s.named/maxNamed*112);
    const isToday = k === dayKey();
    const d = new Date(k+'T00:00:00');
    const lbl = EN() ? WD_EN[d.getDay()] : WD_ZH[d.getDay()];
    const tone = isToday ? 'var(--accent)'
      : s.named ? ok(ramp(pressure()).neon, s.named > maxNamed*0.6 ? '0.7' : '0.4')
      : 'rgba(var(--ink-rgb),.14)';
    return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0">'
      + '<div style="width:100%;height:'+Math.max(3,h)+'px;background:'+tone+'"></div>'
      + '<span style="font:'+(isToday?'600':'400')+' 10px/1 var(--fb);color:'+(isToday?'var(--ink)':'rgba(var(--ink-rgb),.5)')+'">'+esc(lbl)+'</span></div>';
  }).join('');

  // 「很值得」比例：以類別為單位
  const agg = {};
  per.forEach(s => s.done.forEach(b => {
    if(!b.worth) return;
    agg[b.cat] = agg[b.cat] || {n:0,v:0};
    agg[b.cat].n++; if(b.worth==='w_v') agg[b.cat].v++;
  }));
  const nr = ramp(pressure()).neon;
  const shareTone = i => ok(nr, (0.85 - i*0.18).toFixed(2));
  const shareRows = Object.keys(agg).sort((a,b)=>agg[b].v/agg[b].n - agg[a].v/agg[a].n).slice(0,4).map((c,i) => {
    const pct = Math.round(agg[c].v/agg[c].n*100);
    return '<div style="display:flex;align-items:center;gap:10px;padding:5px 0">'
      + '<div style="width:52px;flex:none;font:400 12px/1.5 var(--fb);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(catName(c))+'</div>'
      + '<div style="flex:1;height:9px;background:rgba(var(--ink-rgb),.06)"><div style="height:9px;width:'+pct+'%;background:'+shareTone(i)+'"></div></div>'
      + '<div class="num" style="width:36px;text-align:right;font:600 11.5px/1 var(--fh)">'+pct+'%</div></div>';
  }).join('') || '<div class="foot" style="padding:6px 0">'+esc(t('week_empty'))+'</div>';

  const moments = [];
  keys.slice().reverse().forEach(k => per[keys.indexOf(k)].done.forEach(b => {
    if(b.worth==='w_v' && b.note) moments.push({k, b});
  }));
  const momentRows = moments.slice(0,3).map(m =>
    '<div style="padding:12px 0;border-bottom:1px solid var(--hair-3)">'
    + '<div style="font:400 13.5px/1.6 var(--fb)">「'+esc(m.b.note)+'」</div>'
    + '<div style="font:400 10.5px/1.5 var(--fb);color:rgba(var(--ink-rgb),.45);margin-top:4px">'
    +   esc(dateShort(m.k)) + ' · ' + esc(catName(m.b.cat)) + ' · '
    +   minDur(blockDur(m.b)) + '</div></div>').join('')
    || '<div class="foot" style="padding:12px 0">'+esc(t('three_none'))+'</div>';

  const nwChips = S.cats.map(c =>
    '<button class="chip'+(S.nextWeek.indexOf(c)>=0?' on':'')+'" data-act="nextweek" data-cat="'+c+'" '
    + 'style="padding:8px 11px">'+esc(catName(c))+'</button>').join('');

  const range = dateShort(keys[0]) + ' — ' + dateShort(keys[6]);

  return '<div style="padding:16px 0 0"><div class="h-screen">'+esc(t('week'))+'</div>'
    + '<div style="font:400 11px/1.5 var(--fb);color:rgba(var(--ink-rgb),.5);margin-top:4px">'+esc(range)+'</div></div>'
    + '<div class="blueprint" style="margin-top:18px;padding:16px 14px 12px">' + corners()
    + '<div class="kicker">'+esc(t('named_each_day'))+'</div>'
    + '<div style="display:flex;align-items:flex-end;gap:9px;height:126px;margin-top:14px">'+bars+'</div></div>'
    + '<div style="display:flex;gap:10px;margin-top:14px">'
    + '<div style="flex:1;border:1px solid var(--hair);padding:13px"><div class="num" style="font:600 30px/1 var(--fh)">'+anchorDone
    +   '<span style="font-size:15px;color:rgba(var(--ink-rgb),.45)">/7</span></div>'
    + '<div style="font:400 10.5px/1.5 var(--fb);color:var(--ink-55);margin-top:5px">'+esc(t('anchor_days'))+'</div></div>'
    + '<div style="flex:1;border:1px solid var(--hair);padding:13px"><div class="num" style="font:600 30px/1 var(--fh)">'+hmDur(totalNamed)+'</div>'
    + '<div style="font:400 10.5px/1.5 var(--fb);color:var(--ink-55);margin-top:5px">'+esc(t('named_total'))+'</div></div></div>'
    + '<div class="kicker" style="margin-top:24px;padding-bottom:9px;border-bottom:1px solid var(--hair-2)">'+esc(t('share_v'))+'</div>'
    + '<div style="padding-top:10px">'+shareRows+'</div>'
    + '<div class="foot" style="margin-top:10px">'+esc(t('share_foot'))+'</div>'
    + '<div class="kicker" style="margin-top:24px;padding-bottom:9px;border-bottom:1px solid var(--hair-2)">'+esc(t('three_best'))+'</div>'
    + '<div style="padding-top:6px">'+momentRows+'</div>'
    + '<div style="margin-top:22px;border:1px solid var(--hair);padding:15px">'
    + '<div style="font:400 13px/1.6 var(--fb)">'+esc(t('next_week'))+'</div>'
    + '<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:11px">'+nwChips+'</div></div>'
    + (hasAny ? '' : '<div class="foot" style="margin-top:16px">'+esc(t('week_empty'))+'</div>');
}

function sheetSpend(){
  const sp = ui.spend;
  const mins = sp.isCustom ? sp.custom : sp.min;
  const cat = sp.cat || S.cats[0] || 'work';
  const subject = sp.name.trim() || catName(cat);
  const durBtn = (v,label,flex) => {
    const on = !sp.isCustom && sp.min === v;
    return '<button data-act="dur" data-v="'+v+'" style="flex:'+flex+';padding:13px 0;font:600 '+(v==='custom'?'12':'15')+'px var(--fh);'
      + 'border:1px solid '+(on?'var(--accent)':'var(--hair-2)')+';background:'+(on?'var(--accent-tint)':'transparent')+';'
      + 'color:'+(on?'var(--accent-deep)':'var(--ink)')+'">'+esc(label)+'</button>';
  };
  const customBtn = '<button data-act="dur" data-v="custom" style="flex:1.3;padding:13px 0;font:600 12px var(--fh);'
    + 'border:1px solid '+(sp.isCustom?'var(--accent)':'var(--hair-2)')+';background:'+(sp.isCustom?'var(--accent-tint)':'transparent')+';'
    + 'color:'+(sp.isCustom?'var(--accent-deep)':'var(--ink)')+'">'+esc(t('custom'))+'</button>';

  const suggests = SUGGEST.map((s,i) =>
    '<button class="chip" data-act="suggest" data-i="'+i+'" style="font-size:11.5px">'+esc(EN()?s[1]:s[0])+'</button>').join('');
  const catChips = S.cats.map(c =>
    '<button class="chip'+(cat===c?' on':'')+'" data-act="spend-cat" data-cat="'+c+'">'+esc(catName(c))+'</button>').join('');

  // 開始時間：現在，或自己指定一個時刻
  const start = spendStartAt();
  const later = start - Date.now() >= 1000;
  const whenBtn = (v,label) => {
    const on = sp.when === v;
    return '<button data-act="spend-when" data-v="'+v+'" style="flex:1;padding:11px 0;font:400 12.5px var(--fb);'
      + 'border:1px solid '+(on?'var(--accent)':'var(--hair-2)')+';background:'+(on?'var(--accent-tint)':'transparent')+';'

  };

    + '<div style="display:flex;gap:7px;margin-top:9px">'+whenBtn('now',t('now'))+whenBtn('at',t('pick_time'))+'</div>'

    + '<div class="kicker">SPEND THE NEXT</div>'

          + '<span>'+esc(t('range_hint'))+'</span><span class="num" style="color:var(--ink)">'+sp.custom+' '+esc(t('min'))+'</span></div>'
          + '<input type="range" min="1" max="240" value="'+sp.custom+'" data-inp="custom" style="margin-top:8px"></div>'
        : '')
    + '<div style="margin-top:20px"><div class="kicker">'+esc(t('spend_what'))+'</div>'

/* 主題預覽：用該主題自己的色票畫一格倒數，讓人買之前就看得到 */
function skinPreview(sk){
  const a = sk.stops[0].neon, b = sk.stops[0].bg, hot = sk.stops[2].neon;
  const num = comma(secLeft());
  let bgCss, ink = ok(a), extra = '';
  if(sk.military){
    bgCss = 'radial-gradient(40px 27px at 18% 28%,'+ok([b[0]+0.10,b[1]+0.02,95])+' 0 99%,transparent 100%),'
          + 'radial-gradient(34px 22px at 68% 20%,'+ok([b[0]+0.03,b[1],110])+' 0 99%,transparent 100%),'
          + 'radial-gradient(32px 25px at 46% 80%,'+ok([b[0]+0.16,b[1]+0.03,100])+' 0 99%,transparent 100%),'
          + ok([b[0]+0.08,b[1]+0.02,105]);
    // 迷彩的預覽墨色以前寫死近白，日間那一面的斑塊是淺的，字會整個消失
    ink = sk.light ? '#2B2A1C' : '#EDE9D6';
    extra = 'text-shadow:0 1px 3px rgba(0,0,0,' + (sk.light ? '.15' : '.5') + ');';
  }else if(sk.light){
    bgCss = 'repeating-linear-gradient(0deg,transparent 0 15px,'+ok(a,'0.22')+' 15px 16px),'+ok(b);
    ink = ok(hot);
  }else{
    bgCss = 'repeating-linear-gradient(0deg,'+ok(a,'0.13')+' 0 1px,transparent 1px 13px),'
          + 'repeating-linear-gradient(90deg,'+ok(a,'0.13')+' 0 1px,transparent 1px 13px),'+ok(b);
  }
  return '<div class="prev" style="border:1px solid '+ok(a,'0.30')+';background:'+bgCss+'">'
    + '<span class="mono" style="font-size:18px;font-weight:700;color:'+ink+';'+extra+'">'+num+'</span></div>';
}

    + '<div style="position:relative;margin-top:12px;font-size:11px;color:var(--s-dim)">'
    +   esc(EN()?'Anchor finished ':'完成今日 Anchor ')+'<span style="color:var(--s-neon)">+'+COIN_ANCHOR+' ◎</span> · '
    +   esc(EN()?'stretch finished ':'完成一個時段 ')+'<span style="color:var(--s-neon)">+'+COIN_BLOCK+' ◎</span></div>'
    + '</div></div>';

  // 寵物貨架
  const petCards = PETS.map(p => {
    const owned = S.ownedPets.indexOf(p.id) >= 0;
    const on = S.equippedPet === p.id;
    const act = owned ? (on ? '' : 'equip-pet') : 'buy-pet';
    const label = on ? t('pet_equipped')
                : owned ? t('pet_equip')
                : p.free ? t('pet_free') : '◎ ' + p.price;
    return '<button class="shop-pet'+(owned?' own':'')+'"'+(act?' data-act="'+act+'" data-id="'+p.id+'"':'')+'>'
      + '<div class="art">'+p.emoji+'</div>'
      + '<div class="nm">'+esc(petName(p.id))+'</div>'
      + '<div class="pr"'+(on?' style="color:var(--s-gold)"':'')+'>'+esc(label)+'</div></button>';
  }).join('');

  // 主題貨架
  const skinCards = SKINS.map(sk => {
    const owned = S.ownedSkins.indexOf(sk.id) >= 0;
    const on = S.equippedSkin === sk.id;
    const act = owned ? (on ? '' : 'equip-skin') : 'buy-skin';
    const label = on ? (EN()?'In use':'使用中')
                : owned ? t('skin_equip')
                : sk.free ? t('pet_free') : '◎ ' + sk.price;
    return '<button class="shop-card shop-skin"'+(act?' data-act="'+act+'" data-id="'+sk.id+'"':'')+'>'

      + '<div style="font-size:12px;font-weight:600">'+esc(skinName(sk.id))+'</div>'
      + '<div class="mono" style="font-size:11.5px;margin-top:3px;color:'+(on?'var(--s-gold)':'var(--s-neon)')+'">'
      +   esc(label)+'</div></button>';
  }).join('');

  return '<div class="shop">'
    + '<div class="shop-pad" style="padding-top:16px">'
    + '<div class="pix" style="font-size:22px;letter-spacing:.06em;margin-bottom:16px">SHOP '
    +   '<span style="font-family:\'Noto Sans TC\';font-size:12px;letter-spacing:.2em;color:rgba(var(--ink-rgb),.4)">'
    +   esc(t('pet_shop'))+'</span></div></div>'
    + wallet
    + shopRail(t('shop_tab_pets'), 'PETS', petCards)
    + shopRail(t('shop_tab_skins'), 'THEMES', skinCards)
    + '<div class="shop-consum">'
    + '<div style="flex:none;width:42px;height:42px;border-radius:12px;background:var(--accent-tint);'
    +   'border:1px solid var(--accent-30);display:grid;place-items:center;font-size:22px">'+pet.emoji+'</div>'
    + '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700">'+esc(petName(pet.id))+'</div>'
    + '<div style="font-size:11px;color:rgba(var(--ink-rgb),.48);margin-top:2px">'
    +   esc(tFill('pet_days',{n:S.companion.days|0}))+'</div></div>'
    + '<div style="font-size:18px;color:var(--s-dim)">›</div></div>'
    + '</div>';

          +   esc(step===OB_LAST ? t('finish_setup') : step===0 ? t('start') : t('next'))+'</button></div>')
    + '<div style="text-align:center;margin-top:12px;font:400 11px var(--fb);color:var(--ink-42);flex:none">'+esc(t('ob_foot'))+'</div>'
    + '</div>';
}

/* 每一拍就地更新 hero：數字的字級/顏色/動態，以及引線燒到哪裡。
   不整段重畫 —— 重畫會讓火花與抖動的動畫每秒從頭開始。 */
let lastStage = null;
function refreshHero(){
  const hero = document.getElementById('hero');
  if(!hero) return;
  const p = pressure(), out = fuseOut(), pct = pctToday(), rem = (100 - pct).toFixed(2) + '%';

  const sub = document.getElementById('cdSub');
  if(sub) sub.innerHTML = '<span>'+esc(humanLeft(secLeft()))+'</span><span>'
    + esc((EN()?'elapsed ':'已過 ') + pct.toFixed(1) + '%')+'</span>';

  const rope = document.getElementById('fuseRope'); if(rope) rope.style.width = rem;
  const ash  = document.getElementById('fuseAsh');  if(ash)  ash.style.width = pct.toFixed(2) + '%';
  // 只移錨點，不碰火花／光暈的 transform（避免跟 animation 搶）
  const pin = document.getElementById('fusePin');
  if(pin){ pin.style.left = rem; pin.style.top = '50%'; }

  // 階段換了才動字級/動態，避免每秒重設 animation
  const calm = p <= 0;
  const stage = out ? 4 : p > 0.8 ? 3 : p > 0.55 ? 2 : 1;
  const key = stage + '|' + (p > 0.45) + '|' + (92 + p*22).toFixed(0) + '|' + (calm ? '0' : '1');
  if(key !== lastStage){
    lastStage = key;
    const num = document.getElementById('cdNum');
    if(num){
      num.style.fontSize = (92 + p*22).toFixed(0) + 'px';
      num.style.color = p > 0.45 ? 'var(--accent)' : 'var(--ink)';
      num.style.animation = heroAnim();
    }
    const mood = document.getElementById('cdMood');
    if(mood){ mood.textContent = moodLine();
              mood.style.color = p > 0.6 ? ok(ramp(p).neon,'0.85') : 'var(--ink-55)'; }
    const bomb = document.getElementById('fuseBomb');
    if(bomb) bomb.style.animation = out ? 'n-rattle .22s linear infinite'
                                  : p > 0.75 ? 'n-bombpulse 1.4s ease-in-out infinite' : 'none';
    const flare = document.getElementById('fuseFlare');
    if(flare) flare.style.animation = calm ? 'none' : 'n-flare .9s ease-in-out infinite';
    const spark = document.getElementById('fuseSpark');
    if(spark) spark.style.animation = calm ? 'none' : 'n-spark .32s ease-in-out infinite';
    const pinEl = document.getElementById('fusePin');
    if(pinEl && calm){
      Array.prototype.forEach.call(pinEl.children, el => {
        if(/n-ember/.test(el.style.animation || '')) el.style.animation = 'none';
      });
    }
  }
}

/* ── 6. Render ──────────────────────────────────────────────────────── */
function tabBtn(id, icon, label){

/* render() 是整段換掉 innerHTML，捲動位置會被歸零 —— 設定頁每按一個開關就跳回最上面，
   感覺就像「捲不下去」。同一個分頁內要把位置接回去，換分頁／換收據才回到最上面。 */

    + '<span class="brand">86,400</span><span class="date">'+esc(dateBar())+'</span></div>'
    + '<div class="langsw"><button data-act="lang" data-v="zh"'+(S.lang==='zh'?' class="on"':'')+'>中</button>'
    + '<button data-act="lang" data-v="en"'+(S.lang==='en'?' class="on"':'')+'>EN</button></div></div>'
    + '<div class="scroll" id="scroll">'+screen+'</div>'
    + '<div class="tabs">'
    + tabBtn('shop','<span class="ic ic-shop"><i></i><i></i><i></i></span>', t('tab_shop'))
    + tabBtn('receipt','<span class="ic ic-receipt"><i></i><i></i><i></i></span>', t('tab_receipt'))
    + tabBtn('today','<span class="ic ic-today"><i></i></span>', t('tab_today'))
    + tabBtn('insights','<span class="ic ic-insights"><i style="height:6px"></i><i style="height:13px"></i><i style="height:9px"></i></span>', t('tab_insights'))
    + tabBtn('settings','<span class="ic ic-settings"></span>', t('tab_settings'))
    + '</div>'

    + (ui.sheet === 'worth' ? sheetWorth() : '')

/* ── 7. 事件 ─────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const stop = e.target.closest('[data-stop]');
  const el = e.target.closest('[data-act]');
  if(!el){ return; }
  const act = el.dataset.act;
  // 點 sheet 內部不要關閉
  if(act === 'close-sheet' && stop && el.dataset.act !== 'close-sheet') return;
  if(act === 'close-sheet' && el.classList.contains('scrim') && stop) return;

  switch(act){
    case 'lang':   setState(()=>{ S.lang = el.dataset.v; }); break;
    case 'tab':    ui.receiptDay = null; setState(()=>{ S.tab = el.dataset.v; }); break;
    case 'anchor-save': saveAnchor(); break;
    case 'anchor-edit': ui.anchorEdit = true; ui.anchorDraft = today().anchor.text;
                        render();
                        { const i = document.getElementById('anchorInput');
                          if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
                        break;
    case 'anchor-cancel': ui.anchorCancelling = true; ui.anchorDraft = null; ui.anchorEdit = false;
                          render(); setTimeout(()=>{ ui.anchorCancelling = false; }, 400); break;
    case 'anchor-done': commitAnchorDraft(); setState(()=>{ const a = today().anchor;
                          if(a.state === 'done'){ a.state = 'doing'; a.doneAt = null; undoAnchorReward(); }
                          else { a.state = 'done'; a.doneAt = Date.now(); rewardAnchorDone(); } }); break;
    case 'anchor-drop': commitAnchorDraft(); setState(()=>{ const a = today().anchor;
                          a.state = a.state === 'dropped' ? 'doing' : 'dropped'; }); break;
    case 'quick': {
      const v = el.dataset.min;
      const d = new Date(Date.now() + 15*60000);     // 指定時間預設抓 15 分鐘後
      ui.spend = { min: v==='custom'?30:parseInt(v,10), custom:30, isCustom: v==='custom',
                   name:'', cat:S.cats[0]||'work', link:false,
                   when:'now', at:p2(d.getHours())+':'+p2(d.getMinutes()), warn:false };
      ui.sheet = 'spend'; ui.focusSpend = false; render(); break;
    }
    case 'spend-when': ui.spend.when = el.dataset.v; ui.spend.warn = false; render(); break;
    case 'start-now':  startScheduled(el.dataset.id); break;
    case 'drop-block': dropScheduled(el.dataset.id); break;
    case 'dur': {
      const v = el.dataset.v;
      if(v === 'custom'){ ui.spend.isCustom = true; }
      else { ui.spend.isCustom = false; ui.spend.min = parseInt(v,10); }
      render(); break;
    }
    case 'suggest': ui.spend.name = (EN()?SUGGEST[el.dataset.i][1]:SUGGEST[el.dataset.i][0]); render(); break;
    case 'spend-cat': ui.spend.cat = el.dataset.cat; render(); break;
    case 'spend-link': ui.spend.link = !ui.spend.link; render(); break;
    case 'close-sheet': ui.sheet = null; ui.petMemoId = null; render(); break;
    case 'start': createBlock(); break;
    case 'end-early': endBlock(); break;
    case 'extend': extend15(); break;
    case 'worth-pick':  ui.worth.pick = el.dataset.v; render(); break;
    case 'worth-again': ui.worth.again = !ui.worth.again; render(); break;
    case 'worth-save':  saveWorth(false); break;
    case 'worth-skip':  saveWorth(true); break;
    case 'open-day':    ui.receiptDay = el.dataset.day || null; render();
                        document.getElementById('scroll').scrollTop = 0; break;
    case 'tomorrow': {
      const k = el.dataset.day, c = el.dataset.cat;
      setState(()=>{ const d = S.days[k] || today(); d.tomorrow = d.tomorrow || [];
        const i = d.tomorrow.indexOf(c); i>=0 ? d.tomorrow.splice(i,1) : d.tomorrow.push(c); S.days[k] = d; });
      break;
    }
    case 'nextweek': setState(()=>{ const i = S.nextWeek.indexOf(el.dataset.cat);
                       i>=0 ? S.nextWeek.splice(i,1) : S.nextWeek.push(el.dataset.cat); }); break;
    case 'disp':  setState(()=>{ S.disp = el.dataset.v; }); break;
    case 'appearance': setState(()=>{ S.appearance = el.dataset.v;
                         lastSkin = ''; lastStage = null; applyPressure(); }); break;
    case 'night': setState(()=>{ S.night = !S.night; lastSkin = ''; lastStage = null; applyPressure(); }); break;
    case 'tick':  setState(()=>{ S.tick = !S.tick; }); break;
    case 'cats-open': ui.catsOpen = !ui.catsOpen; render(); break;
    case 'cat-toggle': setState(()=>{ const c = el.dataset.cat, i = S.cats.indexOf(c);
                         if(i>=0){ if(S.cats.length>1) S.cats.splice(i,1); } else S.cats.push(c); }); break;
    case 'export': exportBackup(); break;
    case 'import': {
      const inp = document.getElementById('importFile');
      if(!inp) break;
      inp.value = '';
      inp.onchange = () => { importBackup(inp.files && inp.files[0]); inp.onchange = null; };
      inp.click();
      break;
    }
    case 'demo':   toggleDemo(); break;
    case 'redo-ob': ui.ob = 0; ui.auth = { name:'', pass:'', pass2:'', mode:'register', err:'' };
                    setState(()=>{ S.onboarded = false; S.homeTip = true; }); break;
    case 'wipe':   if(confirm(t('confirm_delete'))){ localStorage.removeItem(KEY);
                     localStorage.removeItem(KEY_BROKEN);   // 「刪除全部」要連壞掉的那份一起清
                     loadFailed = false;
                     S = migrateState({}); resetUiState(); lastSkin = '';
                     save(); applyPressure(); render(); } break;
    case 'open-shop': ui.shopTab = 'pets'; setState(()=>{ S.tab = 'shop'; ui.sheet = null; }); break;
    case 'open-cabinet': ui.sheet = 'cabinet'; render(); break;
    case 'shop-tab': ui.shopTab = el.dataset.v; render(); break;
    case 'buy-pet': buyPet(el.dataset.id); break;
    case 'equip-pet': equipPet(el.dataset.id); break;
    case 'buy-skin': buySkin(el.dataset.id); break;
    case 'equip-skin': equipSkin(el.dataset.id); break;
    case 'pet-memo': ui.petMemoId = el.dataset.id; ui.sheet = 'pet-memo'; render(); break;
    case 'close-memo': ui.petMemoId = null; ui.sheet = 'cabinet'; render(); break;
    case 'home-tip-ok': setState(()=>{ S.homeTip = false; }); break;
    case 'auth-mode': ui.auth.mode = el.dataset.v; ui.auth.err = ''; render(); break;
    case 'acct-guest':
      beginGuest();
      if(!S.onboarded){ ui.ob = Math.max(ui.ob, 5); save(); render(); }
      else { setState(()=>{}); }
      break;
    case 'acct-register':
      if(registerLocalAccount()){
        if(!S.onboarded){ ui.ob = 5; save(); render(); }
        else setState(()=>{});
      }else render();
      break;
    case 'acct-login':
      if(loginLocalAccount()){
        if(!S.onboarded){ ui.ob = 5; save(); render(); }
        else setState(()=>{});
      }else render();
      break;
    case 'acct-logout': logoutLocalAccount(); break;
    case 'ob-prev': ui.ob = Math.max(0, ui.ob-1); render(); break;
    case 'ob-next':
      if(ui.ob === 4){ render(); break; } // 帳戶步用專用按鈕
      if(ui.ob < OB_LAST){ ui.ob++; render(); }
      else { setState(()=>{ S.onboarded = true; S.tab = 'today'; S.homeTip = true; }); }
      break;
    default:
      if(act.indexOf('notif:') === 0){
        const k = act.split(':')[1];
        setState(()=>{ S.notif[k] = !S.notif[k]; });
        if(S.notif[k] && 'Notification' in window && Notification.permission === 'default'){
          Notification.requestPermission();
        }
      }
  }
});

// Anchor 打字時只記草稿，不寫入資料；離開欄位或按儲存才真的存下去
function commitAnchorDraft(){
  if(ui.anchorDraft === null) return;
  const a = today().anchor;
  if(ui.anchorDraft !== a.text){
    a.text = ui.anchorDraft; a.setAt = Date.now();
    delete today().demoAnchor;
    save();
  }
  ui.anchorDraft = null;
  ui.anchorEdit = false;
}
// 文字/滑桿輸入：不重繪（避免游標跳掉），只就地更新受影響的小元件
document.addEventListener('input', e => {

  if(el.id === 'anchorInput'){
    ui.anchorDraft = el.value;
    const dirty = el.value !== today().anchor.text;
    const st = document.getElementById('anchorStatus');
    if(st){ st.textContent = anchorStatusText();
            st.style.color = dirty ? 'var(--accent-deep)' : 'rgba(var(--ink-rgb),.45)'; }

    if(btn){ btn.style.display = dirty ? '' : 'none';
             btn.classList.toggle('btn-fill', dirty); }

  }
  if(el.dataset.inp === 'spend-at'){
    ui.spend.at = el.value;
    const [h,m] = (el.value||'').split(':').map(Number);
    const d = new Date(); d.setHours(h||0, m||0, 0, 0);
    ui.spend.warn = d.getTime() <= Date.now();
    refreshSpendPreview();
    return;
  }
  if(el.id === 'spendName'){ ui.spend.name = el.value; refreshSpendPreview(); return; }
  if(el.id === 'worthNote'){ ui.worth.note = el.value; return; }
  if(el.dataset.inp === 'custom'){
    ui.spend.custom = parseInt(el.value,10) || 1;
    const lbl = el.previousElementSibling && el.previousElementSibling.lastElementChild;
    if(lbl) lbl.textContent = ui.spend.custom + ' ' + t('min');
    refreshSpendPreview();
    return;
  }
  if(el.dataset.inp === 'wake'){ S.wake = el.value; save(); return; }
  if(el.dataset.inp === 'sleep'){ S.sleep = el.value; save(); return; }
  if(el.dataset.inp === 'auth-name'){ ui.auth.name = el.value; return; }
  if(el.dataset.inp === 'auth-pass'){ ui.auth.pass = el.value; return; }
  if(el.dataset.inp === 'auth-pass2'){ ui.auth.pass2 = el.value; return; }
});

/* ── 8. 心跳：永遠從牆上時鐘重算 ─────────────────────────────────────── */
let lastDay = dayKey();
function heartbeat(){
  applyPressure();
  if(!S.onboarded) return;

  if(dayKey() !== lastDay){            // 跨過本地午夜 → 先收尾進行中，再結算寵物
    const prev = lastDay;
    const a0 = activeBlock();
    if(a0){
      // 必須在 settle 之前結束，否則「進行中」會被誤判為失敗而炸掉
      a0.endedAt = Math.min(Date.now(), a0.endAt || Date.now());
      S.activeId = null;
      rewardBlockDone(a0);
      ui.worth = { blockId:a0.id, pick:null, note:'', again:false };
      ui.sheet = 'worth';
    }
    settlePetDay(prev);
    lastDay = dayKey(); S.fired = {}; S.firedDay = lastDay;
    ui.anchorDraft = null; ui.anchorEdit = false;
    save(); render(); return;
  }
  const act = activeBlock();
  if(act && Date.now() >= act.endAt){ endBlock(); return; }

  // 排定的區塊到時間就自己開始；有東西在跑的時候會等它結束
  if(!act){
    const due = scheduledToday().filter(b => b.startAt <= Date.now())[0];
    if(due){ startScheduled(due.id); return; }
  }

  const left = secLeft();
  const num = document.getElementById('cdNum');
  if(num){
    const v = fmtDisp(left);
    if(num.textContent !== v) num.textContent = v;
  }
  const ck = document.getElementById('cdClock');
  if(ck){ const v = nowClock(); if(ck.textContent !== v) ck.textContent = v; }
  refreshHero();
  if(act){
    const remain = Math.max(0, Math.round((act.endAt - Date.now())/1000));
    const total = Math.max(1, Math.round((act.endAt - act.startedAt)/1000));
    const an = document.getElementById('acNum'); if(an) an.textContent = comma(remain);
    const ab = document.getElementById('acBar'); if(ab) ab.style.width = ((total-remain)/total*100).toFixed(2)+'%';
    const al = document.getElementById('acLine'); if(al) al.textContent = activeLine();
  }
  const rl = document.getElementById('rcLeft'); if(rl && !ui.receiptDay) rl.textContent = comma(left);
  const uv = document.getElementById('unnamedVal');
  if(uv) uv.textContent = hmDur(stats(dayKey()).unnamed);
  const ru = document.getElementById('rcUnnamed');
  if(ru && !ui.receiptDay) ru.textContent = hmDur(stats(dayKey()).unnamed);

  checkNotif(left);
}
// 分頁在背景時 setInterval 會被節流到大約一分鐘一拍，精準比對分鐘容易整個跳過；
// 改成「到點之後 5 分鐘內都算數」，一天只響一次由 fired 保證
function dueSince(hm, target, grace){
  if(!target) return false;
  const mins = s => { const [h,m] = String(s).split(':').map(Number); return (h||0)*60 + (m||0); };
  const d = mins(hm) - mins(target);
  return d >= 0 && d <= (grace || 5);
}
function checkNotif(left){
  // 跨日就清空提醒旗標。以前只在「頁面開著跨過午夜」才清，關 App 過夜就永遠不再響。
  if(S.firedDay !== dayKey()){ S.firedDay = dayKey(); S.fired = {}; save(); }
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date(), hm = p2(now.getHours())+':'+p2(now.getMinutes());
  const fire = (k, body) => {
    if(S.fired[k]) return;
    S.fired[k] = true; save();
    try{ new Notification('86,400', { body }); }catch(e){}
  };
  if(S.notif.wake && dueSince(hm, S.wake))
    fire('wake', EN()?'Set today’s Anchor.':'設定今天的 Today Anchor。');
  if(S.notif.three && left <= 10800 && left > 10500)
    fire('three', EN()?'3 hours left. Plan the rest of today.':'今天剩三小時，請安排剩餘時間。');
  if(S.notif.sleep && dueSince(hm, S.sleep))
    fire('sleep', EN()?'Open today’s Receipt.':'查看今天的收據。');
}

  if(darkQuery.addEventListener) darkQuery.addEventListener('change', onFaceChange);
  else if(darkQuery.addListener) darkQuery.addListener(onFaceChange);   // 舊 Safari
}

document.addEventListener('visibilitychange', () => {

});

/* ── 9. PWA：manifest 與圖示都在執行時產生，維持單檔 ─────────────────── */
function pwaBits(){
  const icon = size => {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d');
    // 對齊 After Hours 白天（p=0）色票
    x.fillStyle = '#101a16'; x.fillRect(0,0,size,size);
    x.strokeStyle = 'rgba(142,240,166,.35)'; x.lineWidth = Math.max(1,size*0.008);
    x.strokeRect(size*0.12, size*0.12, size*0.76, size*0.76);
    x.fillStyle = '#8ef0a6'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '600 ' + Math.round(size*0.21) + 'px "Chakra Petch",sans-serif';
    x.fillText('86,400', size/2, size*0.47);
    x.fillStyle = '#8ef0a6'; x.fillRect(size*0.22, size*0.62, size*0.34, size*0.012);
    return c.toDataURL('image/png');
  };
  try{
    const i192 = icon(192), i512 = icon(512);
    const mf = { name:'86,400', short_name:'86,400', start_url:'.', scope:'.',
                 display:'standalone', orientation:'portrait',
                 background_color:'#101a16', theme_color:'#101a16',
                 icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},
                        {src:i512,sizes:'512x512',type:'image/png',purpose:'any'}] };
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:'application/manifest+json'}));
    document.head.appendChild(l);
    const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = i192;
    document.head.appendChild(a);
  }catch(e){}
  // 極簡 SW：http(s) 下快取自身，file:// 會被瀏覽器拒絕所以略過
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    // 已有控制中的 SW 時，換成新版就重載一次（避免底部順序卡舊殼）
    if(navigator.serviceWorker.controller){
      navigator.serviceWorker.addEventListener('controllerchange', () => { location.reload(); });
    }
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
      .then(reg => { reg.update().catch(()=>{}); })
      .catch(()=>{});
  }
}

/* ── 10. 啟動 ────────────────────────────────────────────────────────── */
catchUpPetSettlement();
applyPressure();
render();
heartbeat();
// 存檔讀不起來時要讓人看見；先畫完畫面再說，不要卡在白屏上
if(loadFailed) setTimeout(() => alert(t('load_broken')), 60);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(pwaBits); else pwaBits();
</script>
